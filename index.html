// ============================================================================
// Geocoding (Nominatim) + GPS
// ============================================================================
let currentGpsCoords = null;
let gpsWatchId = null;

function acquireCurrentGps() {
  return new Promise((resolve, reject) => {
    if (!("geolocation" in navigator)) {
      reject(new Error("Geolocation is not supported by this browser"));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        currentGpsCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude, speedMps: pos.coords.speed, heading: pos.coords.heading };
        resolve(currentGpsCoords);
      },
      (err) => reject(new Error(err.message || "Unable to read GPS location")),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
    );
  });
}

async function resolveLocationInput(rawText, isSource) {
  const trimmed = rawText.trim();
  if (isSource && (!trimmed || /^current\s*location/i.test(trimmed))) {
    if (!currentGpsCoords) {
      logMsg("Acquiring current GPS position...");
      await acquireCurrentGps();
    }
    return { lat: currentGpsCoords.lat, lon: currentGpsCoords.lon, label: "Current Location" };
  }
  if (!trimmed) {
    throw new Error(isSource ? "Please enter a Source or click 'Use Current Location'" : "Please enter a Destination");
  }
  const coordMatch = trimmed.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  if (coordMatch) {
    const lat = parseFloat(coordMatch[1]), lon = parseFloat(coordMatch[2]);
    return { lat, lon, label: `${lat.toFixed(4)}, ${lon.toFixed(4)}` };
  }
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(trimmed)}`;
  const res = await fetch(url, { headers: { "Accept": "application/json" } });
  const results = await res.json();
  if (!results || !results.length) throw new Error(`Location not found: "${trimmed}"`);
  return {
    lat: parseFloat(results[0].lat),
    lon: parseFloat(results[0].lon),
    label: results[0].display_name.split(",").slice(0, 2).join(",")
  };
}

function startGpsTracking() {
  if (gpsWatchId !== null) return;
  if (!("geolocation" in navigator)) {
    logMsg("Geolocation not supported.");
    return;
  }
  pauseAutoDrive();
  const btn = document.getElementById("btnLiveGpsTrack");
  btn.classList.add("active");
  btn.textContent = "Live GPS: On";
  logMsg("Live GPS tracking active.");

  gpsWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude, longitude, speed, heading } = pos.coords;
      currentGpsCoords = { lat: latitude, lon: longitude, speedMps: speed, heading };
      if (!state.hasRealRoute && !state.gpsOrigin) { // no route yet: center the map on the vehicle
        rebaseMap(latitude, longitude);
        state.gpsOrigin = true;
      }
      state.playerX = (longitude - state.originLon) * mPerDegLonAt(state.originLat);
      state.playerY = (latitude - state.originLat) * M_PER_DEG_LAT;
      locateOnRoute(state.playerX, state.playerY);
      if (typeof speed === "number" && !isNaN(speed) && speed >= 0) {
        state.speedMph = Math.round(speed * 2.23694 * 10) / 10;
        document.getElementById("rngSpeed").value = state.speedMph;
      }
      // iOS reports heading = -1/NaN when stationary; keep the last heading then
      if (typeof heading === "number" && !isNaN(heading) && heading >= 0) {
        state.headingDeg = heading;
        document.getElementById("rngHeading").value = Math.round(heading);
        document.getElementById("lblHeading").textContent = `${Math.round(heading)}°`;
      }
      onTripPosition(latitude, longitude);
    },
    (err) => logMsg(`GPS watch warning: ${err.message}`),
    { enableHighAccuracy: true, maximumAge: 1000 }
  );
}

function stopGpsTracking() {
  if (gpsWatchId === null) return;
  navigator.geolocation.clearWatch(gpsWatchId);
  gpsWatchId = null;
  const btn = document.getElementById("btnLiveGpsTrack");
  btn.classList.remove("active");
  btn.textContent = "Live GPS: Off";
  logMsg("Stopped live GPS tracking.");
}

document.getElementById("btnLiveGpsTrack").addEventListener("click", () => {
  if (gpsWatchId !== null) stopGpsTracking();
  else startGpsTracking();
});

// Current player position as WGS84 (GPS when tracking, otherwise derived from the simulator)
function currentPlayerLatLon() {
  if (gpsWatchId !== null && currentGpsCoords) return { lat: currentGpsCoords.lat, lon: currentGpsCoords.lon };
  return {
    lat: state.originLat + state.playerY / M_PER_DEG_LAT,
    lon: state.originLon + state.playerX / mPerDegLonAt(state.originLat)
  };
}

// ============================================================================
// Route geometry helpers
// ============================================================================
// Douglas-Peucker on [{x,y}] (keeps first/last)
function simplifyDP(pts, tol) {
  if (pts.length <= 2) return pts.slice();
  const keep = new Uint8Array(pts.length);
  keep[0] = keep[pts.length - 1] = 1;
  const stack = [[0, pts.length - 1]];
  const tol2 = tol * tol;
  while (stack.length) {
    const [a, b] = stack.pop();
    const ax = pts[a].x, ay = pts[a].y, sx = pts[b].x - ax, sy = pts[b].y - ay;
    const len2 = sx * sx + sy * sy || 1e-9;
    let maxD2 = -1, maxI = -1;
    for (let i = a + 1; i < b; i++) {
      const t = Math.max(0, Math.min(1, ((pts[i].x - ax) * sx + (pts[i].y - ay) * sy) / len2));
      const d2 = (pts[i].x - ax - sx * t) ** 2 + (pts[i].y - ay - sy * t) ** 2;
      if (d2 > maxD2) { maxD2 = d2; maxI = i; }
    }
    if (maxD2 > tol2) {
      keep[maxI] = 1;
      stack.push([a, maxI], [maxI, b]);
    }
  }
  return pts.filter((_, i) => keep[i]);
}

// Simplifies each section between maneuver vertices so turn points stay exact,
// growing the tolerance until the route fits the device's vertex budget.
function simplifyRouteForDevice(pts, maneuverIdxs, maxVerts) {
  const anchors = [...new Set([0, ...maneuverIdxs, pts.length - 1])].sort((a, b) => a - b);
  let tol = 1.5;
  for (let attempt = 0; attempt < 20; attempt++) {
    const out = [];
    const remap = new Map();
    for (let k = 0; k < anchors.length - 1; k++) {
      const section = pts.slice(anchors[k], anchors[k + 1] + 1);
      const simp = simplifyDP(section, tol);
      if (k === 0) { remap.set(anchors[0], 0); out.push(simp[0]); }
      for (let j = 1; j < simp.length; j++) out.push(simp[j]);
      remap.set(anchors[k + 1], out.length - 1);
    }
    if (out.length <= maxVerts || attempt === 19) {
      return { pts: out.slice(0, maxVerts), remap, tol };
    }
    tol *= 1.6;
  }
}

const OSRM_MODIFIER_TO_ID = {
  "uturn": 5, "sharp right": 8, "right": 7, "slight right": 6,
  "straight": 1, "slight left": 2, "left": 3, "sharp left": 4
};

// ============================================================================
// Road tiles: Overpass -> per-tile runs -> 0x20 payloads (grid matches the firmware)
// ============================================================================
const roads = { center: null, inflight: false, lastFailMs: 0 };
// Downloaded map data kept in lat/lon so it survives origin changes (e.g. starting a trip here)
const mapCache = { ways: [], areas: { blocks: [], parks: [], water: [] } };
// Area (buildings/parks/water) download state: gen invalidates in-flight requests when the map
// is reset; pending re-requests the latest spot once the current request finishes
const areasLoad = { inflight: false, pending: null, gen: 0 };

function projectMapCache() {
  const oLat = state.originLat, oLon = state.originLon, mLon = mPerDegLonAt(oLat);
  const proj = (ll) => ll.map(([la, lo]) => ({ x: (lo - oLon) * mLon, y: (la - oLat) * M_PER_DEG_LAT }));
  state.ways = mapCache.ways.map((w) => ({ tier: w.tier, limit: w.limit, pts: proj(w.ll) }));
  const a = mapCache.areas;
  state.areas = { blocks: a.blocks.map(proj), parks: a.parks.map(proj), water: a.water.map(proj) };
}

function clearMapCache() {
  mapCache.ways = [];
  mapCache.areas = { blocks: [], parks: [], water: [] };
  state.ways = [];
  state.tileRuns = new Map();
  state.tileAreas = new Map();
  state.areas = { blocks: [], parks: [], water: [] };
  roads.center = null;
  areasLoad.gen++;
  areasLoad.pending = null;
}

// Move the map origin; reuse downloaded roads/areas if they cover the new spot
function rebaseMap(lat, lon) {
  state.originLat = lat;
  state.originLon = lon;
  if (roads.center && distM(roads.center, { lat, lon }) < 1000) projectMapCache();
  else clearMapCache();
}

const tileKey = (tx, ty) => `${tx},${ty}`;
const tileXOf = (lon) => Math.floor(Math.round(lon * 1e7) / TILE_LON_E7);
const tileYOf = (lat) => Math.floor(Math.round(lat * 1e7) / TILE_LAT_E7);

// OSM maxspeed -> mph ("35 mph" -> 35, "50" (km/h by default) -> 31, "none"/"signals" -> 0)
function parseMaxspeedMph(tag) {
  if (!tag) return 0;
  const m = String(tag).split(";")[0].trim().match(/^(\d+(?:\.\d+)?)\s*(mph|km\/h|kmh)?$/i);
  if (!m) return 0;
  const v = parseFloat(m[1]);
  return Math.min(255, Math.round(m[2] && m[2].toLowerCase() === "mph" ? v : v * 0.621371));
}

function highwayTier(hwy) {
  if (["motorway", "motorway_link", "trunk", "trunk_link"].includes(hwy)) return 3;
  if (["primary", "primary_link", "secondary", "secondary_link", "tertiary", "tertiary_link"].includes(hwy)) return 2;
  return 1;
}

// Splits every way into runs whose segments start in the same tile, so each segment is sent once
function indexWaysIntoTiles(osmWays) {
  const tiles = new Map();
  const push = (key, tier, run) => {
    if (run.length < 2) return;
    if (!tiles.has(key)) tiles.set(key, []);
    for (let s = 0; s < run.length - 1; s += 254) tiles.get(key).push({ tier, ll: run.slice(s, s + 255) });
  };
  for (const w of osmWays) {
    let key = tileKey(tileXOf(w.ll[0][1]), tileYOf(w.ll[0][0]));
    let run = [w.ll[0]];
    for (let i = 1; i < w.ll.length; i++) {
      run.push(w.ll[i]);
      const k = tileKey(tileXOf(w.ll[i][1]), tileYOf(w.ll[i][0]));
      if (k !== key) {
        push(key, w.tier, run);
        key = k;
        run = [w.ll[i]];
      }
    }
    push(key, w.tier, run);
  }
  return tiles;
}

// Sutherland-Hodgman clip of a closed [lat,lon] ring to a lat/lon box
function clipRingToBox(ring, s, w, n, e) {
  const edges = [
    (p) => p[1] >= w, (p) => p[1] <= e, (p) => p[0] >= s, (p) => p[0] <= n
  ];
  const cut = [
    (a, b) => [a[0] + (b[0] - a[0]) * (w - a[1]) / (b[1] - a[1]), w],
    (a, b) => [a[0] + (b[0] - a[0]) * (e - a[1]) / (b[1] - a[1]), e],
    (a, b) => [s, a[1] + (b[1] - a[1]) * (s - a[0]) / (b[0] - a[0])],
    (a, b) => [n, a[1] + (b[1] - a[1]) * (n - a[0]) / (b[0] - a[0])]
  ];
  let out = ring;
  for (let k = 0; k < 4 && out.length; k++) {
    const inp = out, inside = edges[k];
    out = [];
    for (let i = 0; i < inp.length; i++) {
      const a = inp[(i + inp.length - 1) % inp.length], b = inp[i];
      const ain = inside(a), bin = inside(b);
      if (bin) {
        if (!ain) out.push(cut[k](a, b));
        out.push(b);
      } else if (ain) {
        out.push(cut[k](a, b));
      }
    }
  }
  return out;
}

// Buildings / parks / water -> per-tile pieces for the HUD. Polygons crossing a tile edge are
// clipped with a 3 m overlap so neighbouring pieces meet without hairline seams.
function indexAreasIntoTiles(areas) {
  const tiles = new Map();
  const padLat = 3 / M_PER_DEG_LAT;
  const groups = [[AREA_TIER_WATER, areas.water], [AREA_TIER_PARK, areas.parks], [AREA_TIER_BUILDING, areas.blocks]];
  for (const [tier, rings] of groups) {
    for (const ring of rings) {
      if (ring.length < 3) continue;
      let s = 90, n = -90, w = 180, e = -180;
      for (const [la, lo] of ring) { s = Math.min(s, la); n = Math.max(n, la); w = Math.min(w, lo); e = Math.max(e, lo); }
      const tx0 = tileXOf(w), tx1 = tileXOf(e), ty0 = tileYOf(s), ty1 = tileYOf(n);
      const padLon = 3 / mPerDegLonAt(s);
      for (let tx = tx0; tx <= tx1; tx++) {
        for (let ty = ty0; ty <= ty1; ty++) {
          let piece = ring;
          if (tx0 !== tx1 || ty0 !== ty1) {
            const bw = tx * TILE_LON_E7 * 1e-7, bs = ty * TILE_LAT_E7 * 1e-7;
            piece = clipRingToBox(ring, bs - padLat, bw - padLon, bs + TILE_LAT_E7 * 1e-7 + padLat, bw + TILE_LON_E7 * 1e-7 + padLon);
          }
          if (piece.length < 3) continue;
          const k = tileKey(tx, ty);
          if (!tiles.has(k)) tiles.set(k, []);
          tiles.get(k).push({ tier, ll: piece });
        }
      }
    }
  }
  return tiles;
}

const ringAreaM2 = (pts) => {
  let a = 0;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) a += (pts[j].x + pts[i].x) * (pts[j].y - pts[i].y);
  return Math.abs(a) / 2;
};

// Tile-local meter polygons for one tile, simplified to <= 255 vertices, biggest first
function tileAreaPolys(tx, ty) {
  const pieces = state.tileAreas.get(tileKey(tx, ty));
  if (!pieces) return [];
  const mLon = mPerDegLonAt(state.originLat);
  const swLon = (tx * TILE_LON_E7) * 1e-7, swLat = (ty * TILE_LAT_E7) * 1e-7;
  const polys = [];
  for (const p of pieces) {
    let pts = p.ll.map(([lat, lon]) => ({ x: (lon - swLon) * mLon, y: (lat - swLat) * M_PER_DEG_LAT }));
    const a = pts[0], z = pts[pts.length - 1];
    if (Math.abs(a.x - z.x) < 0.01 && Math.abs(a.y - z.y) < 0.01) pts.pop(); // ring is implicitly closed
    const area = ringAreaM2(pts);
    if (p.tier === AREA_TIER_BUILDING ? area < 40 : area < 150) continue; // sheds/specks vanish at HUD zoom
    for (let tol = 1; tol < 64; tol *= 2) {
      pts = simplifyDP(pts, tol);
      if (pts.length <= 255) break;
    }
    if (pts.length < 3 || pts.length > 255) continue;
    polys.push({ tier: p.tier, pts, area });
  }
  return polys;
}

function buildTilePayload(tx, ty) {
  const runs = state.tileRuns.get(tileKey(tx, ty)) || [];
  const areas = tileAreaPolys(tx, ty);
  if (!runs.length && !areas.length) return null;
  const mLon = mPerDegLonAt(state.originLat);
  const swLon = (tx * TILE_LON_E7) * 1e-7, swLat = (ty * TILE_LAT_E7) * 1e-7;
  // Roads in tile-local meters, simplified (1.5 m is sub-pixel at HUD zoom): fewer segments
  // for the device to draw and fewer bytes over BLE
  const roadsM = runs.map((r) => ({
    tier: r.tier,
    pts: simplifyDP(r.ll.map(([lat, lon]) => ({ x: (lon - swLon) * mLon, y: (lat - swLat) * M_PER_DEG_LAT })), 1.5)
  }));
  // Highways and arterials first so the byte budget drops local streets before main roads
  const sorted = roadsM.sort((a, b) => b.tier - a.tier);
  const chosen = [];
  let bytes = 10;
  for (const r of sorted) {
    const sz = 2 + r.pts.length * 4;
    if (bytes + sz > DEVICE_MAX_TILE_BYTES || chosen.length >= 1024) continue;
    chosen.push(r);
    bytes += sz;
  }
  // Then map detail with what's left: water and parks, then the largest buildings
  const prio = (p) => (p.tier === AREA_TIER_BUILDING ? 0 : 1e12) + p.area;
  const chosenAreas = [];
  for (const p of areas.sort((a, b) => prio(b) - prio(a))) {
    const sz = 2 + p.pts.length * 4;
    if (bytes + sz > DEVICE_MAX_TILE_BYTES || chosen.length + chosenAreas.length >= 1024) continue;
    chosenAreas.push(p);
    bytes += sz;
  }
  chosenAreas.sort((a, b) => b.tier - a.tier); // draw order: water, parks, buildings
  const buf = new ArrayBuffer(bytes);
  const dv = new DataView(buf);
  dv.setInt32(0, tx, true);
  dv.setInt32(4, ty, true);
  dv.setUint16(8, chosen.length + chosenAreas.length, true);
  let o = 10;
  const clamp16 = (v) => Math.max(-32767, Math.min(32767, Math.round(v)));
  for (const r of chosen) {
    dv.setUint8(o, r.tier);
    dv.setUint8(o + 1, r.pts.length);
    o += 2;
    for (const pt of r.pts) {
      dv.setInt16(o, clamp16(pt.x), true);
      dv.setInt16(o + 2, clamp16(pt.y), true);
      o += 4;
    }
  }
  for (const p of chosenAreas) {
    dv.setUint8(o, p.tier);
    dv.setUint8(o + 1, p.pts.length);
    o += 2;
    for (const pt of p.pts) {
      dv.setInt16(o, clamp16(pt.x), true);
      dv.setInt16(o + 2, clamp16(pt.y), true);
      o += 4;
    }
  }
  return new Uint8Array(buf);
}

// Public Overpass servers are busy at times (HTTP 502/504): fall back to mirrors
const OVERPASS_URLS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://lz4.overpass-api.de/api/interpreter"
];
async function overpassQuery(query) {
  let last = null;
  for (const url of OVERPASS_URLS) {
    try {
      const res = await fetch(url, { method: "POST", body: "data=" + encodeURIComponent(query) });
      if (res.ok) return await res.json();
      last = new Error(`${new URL(url).host} HTTP ${res.status}`);
    } catch (err) {
      last = err;
    }
  }
  throw last;
}

// Joins open member ways of a multipolygon (e.g. a river) into closed rings
function assembleRings(segs) {
  const rings = [], pool = segs.map((x) => x.slice());
  // [lat, lon] points; 5e-6 deg ~ 0.5 m
  const same = (a, b) => Math.abs(a[0] - b[0]) < 5e-6 && Math.abs(a[1] - b[1]) < 5e-6;
  while (pool.length) {
    let ring = pool.shift(), grew = true;
    while (grew && !same(ring[0], ring[ring.length - 1])) {
      grew = false;
      for (let i = 0; i < pool.length; i++) {
        const seg = pool[i], end = ring[ring.length - 1];
        if (same(end, seg[0])) ring = ring.concat(seg.slice(1));
        else if (same(end, seg[seg.length - 1])) ring = ring.concat(seg.slice(0, -1).reverse());
        else continue;
        pool.splice(i, 1);
        grew = true;
        break;
      }
    }
    rings.push(ring);
  }
  return rings;
}

// City blocks, parks and water for the app's radar (~1 km box), loaded after the roads.
async function loadAreasAround(lat, lon) {
  if (areasLoad.inflight) { areasLoad.pending = { lat, lon }; return; }
  areasLoad.inflight = true;
  const gen = areasLoad.gen;
  const toLL = (p) => [p.lat, p.lon];
  try {
    const dLat = 0.009, dLon = 0.012;
    const bb = `${(lat - dLat).toFixed(4)},${(lon - dLon).toFixed(4)},${(lat + dLat).toFixed(4)},${(lon + dLon).toFixed(4)}`;
    const osm = await overpassQuery(`[out:json][timeout:25];(
      way["building"](${bb});
      way["leisure"~"^(park|garden|pitch|playground)$"](${bb});
      way["landuse"~"^(grass|recreation_ground|cemetery|forest|meadow)$"](${bb});
      way["natural"~"^(water|wood)$"](${bb});
      relation["natural"="water"](${bb});
      relation["waterway"="riverbank"](${bb});
    );out geom qt;`);
    if (gen !== areasLoad.gen || !roads.center || distM(roads.center, { lat, lon }) > 1500) return; // stale
    const areas = { blocks: [], parks: [], water: [] };
    for (const el of osm.elements || []) {
      const t = el.tags || {};
      if (el.type === "way" && el.geometry && el.geometry.length > 2) {
        const pts = el.geometry.map(toLL);
        if (t.building) areas.blocks.push(pts);
        else if (t.natural === "water") areas.water.push(pts);
        else areas.parks.push(pts);
      } else if (el.type === "relation" && el.members) {
        const outer = el.members.filter((m) => m.role !== "inner" && m.geometry).map((m) => m.geometry.map(toLL));
        for (const ring of assembleRings(outer)) areas.water.push(ring);
      }
    }
    mapCache.areas = areas;
    projectMapCache();
    state.tileAreas = indexAreasIntoTiles(areas);
    ble.lastTileKey = null; // resend the tiles around the player with the new detail
    logMsg(`Loaded ${areas.blocks.length} buildings, ${areas.parks.length} parks, ${areas.water.length} water areas for the radar.`);
  } catch (err) {
    logMsg(`Map detail fetch failed: ${errText(err)}`);
  } finally {
    areasLoad.inflight = false;
    const next = areasLoad.pending;
    areasLoad.pending = null;
    if (next && roads.center && distM(roads.center, next) < 1500) loadAreasAround(next.lat, next.lon);
  }
}

async function ensureRoadsAround(lat, lon) {
  if (!(state.hasRealRoute || gpsWatchId !== null) || roads.inflight) return;
  if (roads.center) {
    const dx = (lon - roads.center.lon) * mPerDegLonAt(lat), dy = (lat - roads.center.lat) * M_PER_DEG_LAT;
    if (Math.hypot(dx, dy) < 1200) return;
  }
  if (Date.now() - roads.lastFailMs < 15000) return;
  roads.inflight = true;
  try {
    const dLat = 0.018, dLon = 0.024; // ~2 km around the player
    const bbox = `${(lat - dLat).toFixed(4)},${(lon - dLon).toFixed(4)},${(lat + dLat).toFixed(4)},${(lon + dLon).toFixed(4)}`;
    const query = `[out:json][timeout:20];way["highway"~"^(motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|residential|unclassified|living_street)$"](${bbox});out geom qt;`;
    const osm = await overpassQuery(query);
    const osmWays = [];
    for (const el of osm.elements || []) {
      if (el.type !== "way" || !el.geometry || el.geometry.length < 2) continue;
      osmWays.push({
        tier: highwayTier(el.tags?.highway || "residential"),
        limit: parseMaxspeedMph(el.tags?.maxspeed),
        ll: el.geometry.map((p) => [p.lat, p.lon])
      });
    }
    mapCache.ways = osmWays;
    projectMapCache();
    state.tileRuns = indexWaysIntoTiles(osmWays);
    roads.center = { lat, lon };
    ble.lastTileKey = null; // force a tile refresh on the HUD
    logMsg(`Loaded ${osmWays.length} OSM roads (${state.tileRuns.size} tiles) around the player.`);
    loadAreasAround(lat, lon);
  } catch (err) {
    roads.lastFailMs = Date.now();
    logMsg(`Road fetch failed: ${err.message}`);
  } finally {
    roads.inflight = false;
  }
}

// ============================================================================
// WebBLE streaming: serialized GATT queue, telemetry @ 5 Hz, street + tiles on change
// ============================================================================
const ble = {
  device: null, tel: null, geo: null, connected: false,
  queue: Promise.resolve(), telPending: false, transferId: 1,
  lastStreetSig: "", lastStreetMs: 0,
  lastTileKey: null, sentTiles: new Map(), reconnectTries: 0
};

// Web Bluetooth rejects overlapping GATT operations, so every write goes through one chain
function bleEnqueue(fn) {
  ble.queue = ble.queue.then(fn).catch((err) => {
    if (ble.connected) logMsg(`BLE write failed: ${errText(err)}`);
  });
  return ble.queue;
}

function writeNoResponse(ch, data) {
  return typeof ch.writeValueWithoutResponse === "function" ? ch.writeValueWithoutResponse(data) : ch.writeValue(data);
}

function writeWithResponse(ch, data) {
  return typeof ch.writeValueWithResponse === "function" ? ch.writeValueWithResponse(data) : ch.writeValue(data);
}

// What reaches the HUD: real trips and live GPS, or the simulator while "Simulate drive" is on.
// Otherwise a zeroed keep-alive keeps the link dot green while the HUD shows "No route".
const hudFeedActive = () => state.hasRealRoute || simulating || gpsWatchId !== null;
const hudRouteActive = () => state.hasRealRoute || simulating;

function sendTelemetry() {
  if (!ble.connected || ble.telPending) return;
  if (!hudFeedActive()) {
    const idle = new Uint8Array(24);
    idle[0] = PKT_TELEMETRY;
    ble.telPending = true;
    bleEnqueue(async () => { ble.telPending = false; if (ble.tel) await writeNoResponse(ble.tel, idle); });
    return;
  }
  const { lat, lon } = currentPlayerLatLon();
  const buf = new ArrayBuffer(24);
  const dv = new DataView(buf);
  dv.setUint8(0, PKT_TELEMETRY);
  dv.setInt32(1, Math.round(lat * 1e7), true);
  dv.setInt32(5, Math.round(lon * 1e7), true);
  dv.setUint16(9, Math.round(((state.headingDeg % 360) + 360) % 360 * 100) % 36000, true);
  dv.setUint8(11, Math.min(255, Math.round(state.speedMph)));
  dv.setUint8(12, Math.min(255, state.speedLimitMph));
  dv.setUint8(13, state.maneuverId);
  dv.setUint32(14, Math.round(state.turnDistM), true);
  dv.setUint32(18, Math.round(state.destDistM), true);
  dv.setUint16(22, Math.min(65535, Math.round(state.etaMinutes)), true);
  ble.telPending = true;
  bleEnqueue(async () => {
    ble.telPending = false;
    if (ble.tel) await writeNoResponse(ble.tel, new Uint8Array(buf));
  });
}

function sendStreetIfChanged(force) {
  if (!ble.connected) return;
  const sig = `${state.maneuverId}|${state.nextWpIdx}|${state.streetName}`;
  if (!force && sig === ble.lastStreetSig && Date.now() - ble.lastStreetMs < 3000) return;
  ble.lastStreetSig = sig;
  ble.lastStreetMs = Date.now();
  const pkt = new Uint8Array(36);
  const dv = new DataView(pkt.buffer);
  dv.setUint8(0, PKT_STREET_NAME);
  dv.setUint8(1, state.maneuverId);
  dv.setUint16(2, Math.min(65535, state.nextWpIdx), true);
  const ascii = state.streetName.normalize("NFKD").replace(/[^\x20-\x7E]/g, "").slice(0, 31);
  for (let i = 0; i < ascii.length; i++) pkt[4 + i] = ascii.charCodeAt(i);
  bleEnqueue(async () => { if (ble.tel) await writeWithResponse(ble.tel, pkt); });
}

// Each chunk is its own queue item so telemetry keeps flowing during large transfers
function sendChunkedPayload(payloadType, bytes) {
  const totalChunks = Math.max(1, Math.ceil(bytes.byteLength / BLE_CHUNK_PAYLOAD));
  const tid = (ble.transferId++) & 0xFF;
  let last = null;
  for (let c = 0; c < totalChunks; c++) {
    const slice = bytes.subarray(c * BLE_CHUNK_PAYLOAD, (c + 1) * BLE_CHUNK_PAYLOAD);
    const pkt = new Uint8Array(6 + slice.byteLength);
    const dv = new DataView(pkt.buffer);
    dv.setUint8(0, payloadType);
    dv.setUint8(1, tid);
    dv.setUint16(2, c, true);
    dv.setUint16(4, totalChunks, true);
    pkt.set(slice, 6);
    last = bleEnqueue(async () => { if (ble.geo) await writeWithResponse(ble.geo, pkt); });
  }
  return last;
}

// Empty route: the HUD drops back to its "No route" screen
function sendClearRouteOverBle() {
  if (!ble.connected) return;
  const buf = new ArrayBuffer(10);
  const dv = new DataView(buf);
  dv.setInt32(0, Math.round(state.originLat * 1e7), true);
  dv.setInt32(4, Math.round(state.originLon * 1e7), true);
  dv.setUint16(8, 0, true);
  sendChunkedPayload(PKT_ROUTE_POLYLINE, new Uint8Array(buf));
  ble.sentTiles.clear();
  ble.lastTileKey = null;
}

function sendRouteOverBle() {
  if (!ble.connected || state.routePts.length < 2) return;
  if (!hudRouteActive()) {
    sendClearRouteOverBle();
    return;
  }
  const n = state.routePts.length;
  const buf = new ArrayBuffer(10 + n * 4);
  const dv = new DataView(buf);
  dv.setInt32(0, Math.round(state.originLat * 1e7), true);
  dv.setInt32(4, Math.round(state.originLon * 1e7), true);
  dv.setUint16(8, n, true);
  const clamp16 = (v) => Math.max(-32767, Math.min(32767, Math.round(v)));
  state.routePts.forEach((pt, i) => {
    dv.setInt16(10 + i * 4, clamp16(pt.x), true);
    dv.setInt16(10 + i * 4 + 2, clamp16(pt.y), true);
  });
  sendChunkedPayload(PKT_ROUTE_POLYLINE, new Uint8Array(buf));
  logMsg(`Queued route (0x10): ${n} vertices, ${buf.byteLength} bytes.`);
  ble.sentTiles.clear();
  ble.lastTileKey = null;
  sendStreetIfChanged(true);
}

// Keeps the 3x3 tile neighbourhood around the player on the HUD (fits the C6's 12-tile LRU)
function sendTilesAroundPlayer(lat, lon) {
  if (!ble.connected || !state.tileRuns.size || !hudFeedActive()) return;
  const tx = tileXOf(lon), ty = tileYOf(lat);
  const key = tileKey(tx, ty);
  if (key === ble.lastTileKey) return;
  ble.lastTileKey = key;
  const wanted = new Map();
  let sent = 0;
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      const k = tileKey(tx + dx, ty + dy);
      const payload = buildTilePayload(tx + dx, ty + dy);
      if (!payload) continue;
      const sig = `${payload.byteLength}:${payload.reduce((h, b) => (h * 31 + b) >>> 0, 7)}`;
      wanted.set(k, sig);
      if (ble.sentTiles.get(k) !== sig) {
        sendChunkedPayload(PKT_ROAD_TILE, payload);
        sent++;
      }
    }
  }
  ble.sentTiles = wanted;
  if (sent) logMsg(`Queued ${sent} road tile(s) around ${key}.`);
}

// Speed limit of the road under the player (OSM maxspeed), refreshed once a second.
// 0 = unknown, which hides the red limit tick on the HUD speedometer.
let lastLimitMs = 0;
function updateSpeedLimitFromRoads() {
  if (!(state.hasRealRoute || gpsWatchId !== null) || Date.now() - lastLimitMs < 1000) return;
  lastLimitMs = Date.now();
  const px = state.playerX, py = state.playerY;
  let best = { d2: 30 * 30, limit: 0 }; // only roads within 30 m count
  for (const w of state.ways) {
    if (!w.limit) continue;
    for (let i = 0; i < w.pts.length - 1; i++) {
      const a = w.pts[i], b = w.pts[i + 1];
      if (Math.min(a.x, b.x) - 30 > px || Math.max(a.x, b.x) + 30 < px ||
          Math.min(a.y, b.y) - 30 > py || Math.max(a.y, b.y) + 30 < py) continue;
      const sx = b.x - a.x, sy = b.y - a.y, len2 = sx * sx + sy * sy || 1;
      const t = Math.max(0, Math.min(1, ((px - a.x) * sx + (py - a.y) * sy) / len2));
      const d2 = (px - a.x - sx * t) ** 2 + (py - a.y - sy * t) ** 2;
      if (d2 < best.d2) best = { d2, limit: w.limit };
    }
  }
  state.speedLimitMph = best.limit;
}

setInterval(() => {
  const { lat, lon } = currentPlayerLatLon();
  ensureRoadsAround(lat, lon);
  updateSpeedLimitFromRoads();
  if (!ble.connected) return;
  sendTelemetry();
  if (hudFeedActive()) sendStreetIfChanged(false);
  sendTilesAroundPlayer(lat, lon);
}, TELEMETRY_PERIOD_MS);

async function connectGatt() {
  const server = await ble.device.gatt.connect();
  const service = await server.getPrimaryService(SERVICE_UUID);
  ble.tel = await service.getCharacteristic(CHAR_TELEMETRY_UUID);
  ble.geo = await service.getCharacteristic(CHAR_GEOMETRY_UUID);
  ble.connected = true;
  ble.reconnectTries = 0;
  ble.queue = Promise.resolve();
  ble.telPending = false;
  updateLinkUi();
  logMsg(`Connected to ${ble.device.name || "GTA-HUD"} over WebBLE.`);
  sendRouteOverBle();
}

function onGattDisconnected() {
  ble.connected = false;
  ble.tel = ble.geo = null;
  updateLinkUi();
  if (ble.reconnectTries >= 5) {
    logMsg("HUD disconnected. Tap Connect to retry.");
    return;
  }
  const delayMs = 1000 * 2 ** ble.reconnectTries++;
  logMsg(`HUD disconnected; reconnecting in ${delayMs / 1000}s...`);
  setTimeout(() => connectGatt().catch((err) => {
    logMsg(`Reconnect failed: ${errText(err)}`);
    onGattDisconnected();
  }), delayMs);
}

// Readable text for whatever a browser rejects with (Bluefy can reject with non-Error values)
function errText(err) {
  if (err == null) return String(err);
  if (typeof err === "string") return err;
  const parts = [err.name, err.message].filter(Boolean);
  if (parts.length) return parts.join(": ");
  try { return JSON.stringify(err); } catch { return String(err); }
}

// Shows the device picker. The browser only allows this directly after a user tap, so callers
// must invoke it before any other await in their click handler.
async function connectHud() {
  if (!navigator.bluetooth) throw new Error("Web Bluetooth unavailable (use Chrome/Edge, or Bluefy on iOS)");
  if (ble.device && ble.device.gatt.connected) return;
  if (!ble.device) {
    ble.device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }, { name: "GTA-HUD" }],
      optionalServices: [SERVICE_UUID]
    });
  }
  if (ble.listenerFor !== ble.device) {
    ble.device.addEventListener("gattserverdisconnected", onGattDisconnected);
    ble.listenerFor = ble.device;
  }
  ble.reconnectTries = 0;
  try {
    await connectGatt();
  } catch (err) {
    ble.device = null; // e.g. remembered HUD out of range: next tap shows the picker
    throw err;
  }
}

async function onConnectTap() {
  const pending = connectHud(); // first thing in the tap handler (user-activation rules)
  if ("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(() => {});
  try {
    await pending;
  } catch (err) {
    const msg = `Bluetooth connect failed: ${errText(err)}`;
    logMsg(msg);
    window.alert(`${msg}\n\nMake sure the HUD is powered, nothing else (e.g. a Chrome tab on the Mac) is connected to it, and Bluetooth is allowed for Bluefy in iOS Settings.`);
  }
}
document.getElementById("btnConnectBle").addEventListener("click", onConnectTap);
document.getElementById("linkPill").addEventListener("click", onConnectTap);

// ============================================================================
// Trips: shared Maps links / addresses -> destination (+ stops) -> route
// ============================================================================
// <trip-parser>  (kept self-contained: tools/test_trip_links.js extracts and tests this block)
function parseCoordPair(s) {
  if (s == null) return null;
  const m = String(s).trim().match(/^(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);
  if (!m) return null;
  const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
  if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return { lat, lon };
}

// A place is {lat, lon, name} or {query, name}; "Current/My Location" means "use GPS" (null)
function tripPlace(value, name) {
  if (value == null) return null;
  const v = String(value).replace(/\+/g, " ").trim();
  if (!v || /^(current|my)\s+location$/i.test(v)) return null;
  const c = parseCoordPair(v);
  if (c) return { ...c, name: name || "" };
  return { query: v, name: name || v };
}

function decodeSeg(s) {
  try { return decodeURIComponent(s.replace(/\+/g, " ")); } catch { return s; }
}

// "#go?" query. "share=" is always last and swallows the rest of the string, so a shared link
// still works even if the Shortcut left its own "&"/"?" unencoded.
function parseGoQuery(q) {
  const i = q.indexOf("share=");
  if (i >= 0 && (i === 0 || q[i - 1] === "&")) {
    let share = q.slice(i + 6);
    try { share = decodeURIComponent(share); } catch { /* keep raw */ }
    const params = new URLSearchParams(q.slice(0, Math.max(0, i - 1)));
    params.set("share", share);
    return parseGoParams(params);
  }
  return parseGoParams(new URLSearchParams(q));
}

function parseGoParams(params) {
  const via = (params.get("via") || "").split("|").map((v) => tripPlace(v)).filter(Boolean);
  const dest = tripPlace(params.get("dest"), params.get("name") || "");
  if (dest) return { dest, via };
  let share = params.get("share");
  if (!share) return null;
  // A lone link with raw spaces (not every share path encodes them) is still one link
  if (/^https?:\/\//i.test(share.trim()) && !share.includes("\n")) share = share.trim().replace(/ /g, "%20");
  const t = parseTripInput(share);
  if (t && params.get("name") && !t.dest.name) t.dest.name = params.get("name");
  return t;
}

// Accepts whatever a share sheet / clipboard / AirDrop hands over: Apple Maps (unified iOS 18.4+
// and legacy) URLs, Google Maps place/dir/search/@ URLs, Waze links, our own #go links,
// "lat,lon", or plain text (name / address lines). Returns { dest, via[], source? } or null.
function parseTripInput(raw) {
  const text = String(raw || "").trim();
  if (!text) return null;
  const direct = parseCoordPair(text);
  if (direct) return { dest: { ...direct, name: "" }, via: [] };

  const urlMatch = text.match(/https?:\/\/[^\s<>"]+/i);
  const otherLines = text.split(/\n+/).map((l) => l.trim()).filter((l) => l && !/https?:\/\//i.test(l));
  const textFallback = () => otherLines.length
    ? { dest: { query: otherLines.slice(0, 2).join(", "), name: otherLines[0] }, via: [] }
    : null;
  if (!urlMatch) return { dest: { query: otherLines.join(", "), name: otherLines[0] }, via: [] };

  let u;
  try { u = new URL(urlMatch[0]); } catch { return textFallback(); }
  const host = u.hostname.replace(/^www\./, "").toLowerCase();
  const p = u.searchParams;
  const path = u.pathname;

  // Our own trip links (e.g. pasted from the "Send to HUD" Shortcut)
  if (u.hash.startsWith("#go?")) return parseGoQuery(u.hash.slice(4));

  // Apple Maps
  if (host === "maps.apple.com" || host === "maps.apple" || host.endsWith(".maps.apple.com")) {
    const name = p.get("name") || p.get("q") || "";
    const dst = p.get("destination") || p.get("daddr");
    if (dst) {
      return {
        dest: tripPlace(dst, ""),
        via: p.getAll("waypoint").map((w) => tripPlace(w)).filter(Boolean),
        source: tripPlace(p.get("source") || p.get("saddr"))
      };
    }
    const coord = parseCoordPair(p.get("coordinate") || p.get("ll") || "");
    if (coord) return { dest: { ...coord, name }, via: [] };
    const q = p.get("address") || p.get("query") || p.get("q");
    if (q) return { dest: tripPlace(q, name || q), via: [] };
    return textFallback(); // e.g. an unexpanded maps.apple/p/... short link
  }

  // Google Maps
  const isGoogle = (/(^|\.)google\.[a-z.]+$/.test(host) && path.startsWith("/maps")) || host.startsWith("maps.google.");
  if (isGoogle) {
    if (p.has("destination")) {
      return {
        dest: tripPlace(p.get("destination")),
        via: (p.get("waypoints") || "").split("|").map((w) => tripPlace(w)).filter(Boolean),
        source: tripPlace(p.get("origin"))
      };
    }
    const parts = path.split("/");
    const stop = (s) => s.startsWith("@") || s.startsWith("data=") || s === "am=t";
    const di = parts.indexOf("dir");
    if (di >= 0) {
      const list = [];
      for (const s of parts.slice(di + 1)) { if (stop(s)) break; list.push(decodeSeg(s)); }
      while (list.length && !list[list.length - 1]) list.pop();
      if (list.length) {
        const places = list.map((s) => tripPlace(s));
        return {
          dest: places[places.length - 1],
          via: places.slice(1, -1).filter(Boolean),
          source: list.length > 1 ? places[0] : null
        };
      }
    }
    const pinned = path.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) || u.href.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
    const at = path.match(/\/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
    const pi = parts.indexOf("place");
    const placeName = pi >= 0 && parts[pi + 1] ? decodeSeg(parts[pi + 1]) : "";
    if (pinned) return { dest: { lat: parseFloat(pinned[1]), lon: parseFloat(pinned[2]), name: placeName }, via: [] };
    if (placeName) {
      const asCoord = parseCoordPair(placeName);
      if (asCoord) return { dest: { ...asCoord, name: "" }, via: [] };
      if (at) return { dest: { lat: parseFloat(at[1]), lon: parseFloat(at[2]), name: placeName }, via: [] };
      return { dest: tripPlace(placeName), via: [] };
    }
    const si = parts.indexOf("search");
    const q = p.get("query") || p.get("q") || p.get("daddr") || (si >= 0 && parts[si + 1] ? decodeSeg(parts[si + 1]) : "");
    if (q) return { dest: tripPlace(q), via: [] };
    const ll = parseCoordPair(p.get("ll") || "");
    if (ll) return { dest: { ...ll, name: "" }, via: [] };
    if (at) return { dest: { lat: parseFloat(at[1]), lon: parseFloat(at[2]), name: "" }, via: [] };
    return textFallback();
  }

  // Waze
  if (host === "waze.com" || host.endsWith(".waze.com")) {
    const ll = parseCoordPair(p.get("ll") || "");
    if (ll) return { dest: { ...ll, name: "" }, via: [] };
    if (p.get("q")) return { dest: tripPlace(p.get("q")), via: [] };
  }

  // Unexpanded short links (maps.app.goo.gl, maps.apple/p, ...) or unknown sites: use the text
  return textFallback();
}
// </trip-parser>

async function resolveTripPlace(place) {
  if (place.lat != null) {
    return { lat: place.lat, lon: place.lon, label: place.name || `${place.lat.toFixed(4)}, ${place.lon.toFixed(4)}` };
  }
  const r = await resolveLocationInput(place.query, false);
  return { lat: r.lat, lon: r.lon, label: place.name || r.label };
}

function distM(a, b) {
  return Math.hypot((b.lon - a.lon) * mPerDegLonAt(a.lat), (b.lat - a.lat) * M_PER_DEG_LAT);
}

const TRIP_KEY = "gtaHudTrip";
const TRIP_MAX_AGE_MS = 12 * 3600 * 1000;
let pendingTrip = null; // parsed, not yet started
let activeTrip = null;  // { dest:{lat,lon,label}, via:[{lat,lon,label,passed}], startedAt, arrived }
const tripState = { offSince: 0, lastRerouteMs: 0, rerouting: false };

function saveTrip() {
  if (!activeTrip) return;
  try { localStorage.setItem(TRIP_KEY, JSON.stringify(activeTrip)); } catch { /* private mode */ }
}

function clearSavedTrip() {
  try { localStorage.removeItem(TRIP_KEY); } catch { /* ignore */ }
}

function loadSavedTrip() {
  try {
    const t = JSON.parse(localStorage.getItem(TRIP_KEY) || "null");
    if (!t || t.arrived || Date.now() - t.startedAt > TRIP_MAX_AGE_MS) return null;
    return {
      dest: { lat: t.dest.lat, lon: t.dest.lon, name: t.dest.label },
      via: t.via.filter((v) => !v.passed).map((v) => ({ lat: v.lat, lon: v.lon, name: v.label }))
    };
  } catch { return null; }
}

function placeLabel(p) {
  return p.name || p.query || `${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`;
}

async function startTrip(parsed) {
  // Bluetooth first: requestDevice() is only allowed directly after the user's tap
  const pending = ble.connected ? Promise.resolve() : connectHud();
  if ("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(() => {});
  const cta = document.getElementById("btnStart");
  cta.disabled = true;
  cta.textContent = "Starting…";
  await pending.catch((err) => {
    logMsg(`Bluetooth connect failed: ${errText(err)} (route continues; tap the Bluetooth button to retry)`);
    setHint("HUD not connected. The route still works; tap the Bluetooth button to connect.");
  });
  try {
    // "From" defaults to the vehicle's GPS position; any typed address is used instead (desk testing)
    const fromText = document.getElementById("inpStart").value.trim();
    const useGps = !fromText || /^current\s*location$/i.test(fromText);
    let src;
    if (useGps) {
      logMsg("Getting GPS position...");
      const here = await acquireCurrentGps();
      src = { lat: here.lat, lon: here.lon, label: "Current location" };
    } else {
      src = await resolveLocationInput(fromText, true);
    }
    const dest = await resolveTripPlace(parsed.dest);
    const via = [];
    for (const v of parsed.via || []) via.push({ ...(await resolveTripPlace(v)), passed: false });
    activeTrip = { dest, via, startedAt: Date.now(), arrived: false };
    pendingTrip = null;
    resumeTrip = null;
    saveTrip();
    addRecent(dest);
    document.getElementById("inpDest").value = dest.label;
    await planRoute(src, via, dest);
    if (!simulating) startGpsTracking();
  } catch (err) {
    logMsg(`Trip error: ${err.message}`);
    setHint(`Couldn't start: ${err.message}`);
    activeTrip = null;
  } finally {
    cta.disabled = false;
    lastUi = "";
    updateSheet();
  }
}

// Called on every GPS fix while a trip is active: stops, arrival and off-route rerouting
function onTripPosition(lat, lon) {
  if (!activeTrip || activeTrip.arrived) return;
  const here = { lat, lon };
  for (const v of activeTrip.via) {
    if (!v.passed && distM(here, v) < 50) {
      v.passed = true;
      saveTrip();
      logMsg(`Reached stop: ${v.label}`);
    }
  }
  if (distM(here, activeTrip.dest) < 40) {
    activeTrip.arrived = true;
    clearSavedTrip();
    logMsg(`Arrived at ${activeTrip.dest.label}.`);
    return;
  }
  const now = Date.now();
  if (nav.offRouteM > 60) {
    if (!tripState.offSince) tripState.offSince = now;
    if (now - tripState.offSince > 5000 && now - tripState.lastRerouteMs > 15000 && !tripState.rerouting) {
      reroute(here);
    }
  } else {
    tripState.offSince = 0;
  }
}

async function reroute(here) {
  tripState.rerouting = true;
  tripState.lastRerouteMs = Date.now();
  tripState.offSince = 0;
  logMsg("Off route: recalculating...");
  try {
    await planRoute({ ...here, label: "Current Location" }, activeTrip.via.filter((v) => !v.passed), activeTrip.dest, { reroute: true });
  } catch (err) {
    logMsg(`Reroute failed: ${err.message}`);
  } finally {
    tripState.rerouting = false;
  }
}

// Incoming trip from the URL: "#go?dest=..|share=.." (iOS Shortcut) or "?title&text&url" (Android share)
function tripFromLocation() {
  if (location.hash.startsWith("#go?")) return parseGoQuery(location.hash.slice(4));
  const q = new URLSearchParams(location.search);
  if (q.has("title") || q.has("text") || q.has("url")) {
    return parseTripInput([q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n"));
  }
  return null;
}

function checkIncomingTrip() {
  const t = tripFromLocation();
  if (t && t.dest) {
    history.replaceState(null, "", location.pathname); // don't re-trigger on reload; resume covers that
    setPendingTrip(t);
    return;
  }
  const saved = loadSavedTrip();
  if (saved) {
    resumeTrip = saved;
    renderRecents();
  }
}

window.addEventListener("hashchange", checkIncomingTrip);

document.getElementById("btnPasteTrip").addEventListener("click", async () => {
  let text = "";
  try {
    text = await navigator.clipboard.readText();
  } catch {
    text = window.prompt("Paste a Maps link, address or lat,lon") || "";
  }
  const t = parseTripInput(text);
  if (t && t.dest) {
    setPendingTrip(t);
    return;
  }
  const shortLink = /maps\.apple\/p\/|maps\.app\.goo\.gl|goo\.gl\/maps/i.test(text);
  const msg = !text.trim()
    ? "The clipboard is empty (or the paste wasn't allowed). Copy a place or link in Maps, then tap Paste trip again."
    : shortLink
      ? "That's a short Maps link, which a web page can't open on its own. Use the \"Send to HUD\" shortcut (it expands the link), or copy the place's address instead and paste that."
      : `Couldn't find a place in what was pasted:\n\n${text.slice(0, 200)}`;
  logMsg(msg.replace(/\n+/g, " "));
  window.alert(msg);
});

// ============================================================================
// Routing: OSRM (turn-by-turn, with stops) -> simplified route + roads -> HUD
// ============================================================================
// src/dest/via items are {lat, lon, label}. On reroute the route stays relative to the trip's
// existing origin (so cached roads/tiles stay valid) unless we've driven > 20 km from it.
async function planRoute(src, via, dest, opts = {}) {
  const keepOrigin = opts.reroute && state.hasRealRoute && distM({ lat: state.originLat, lon: state.originLon }, src) < 20000;
  const stops = [src, ...via, dest];
  logMsg(`Routing ${src.label} -> ${via.length ? via.map((v) => v.label).join(" -> ") + " -> " : ""}${dest.label}...`);
  const coords = stops.map((p) => `${p.lon},${p.lat}`).join(";");
  const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=true`);
  const data = await res.json();
  if (!data.routes || !data.routes.length) throw new Error("No driving route found");
  const route = data.routes[0];

  if (!keepOrigin) rebaseMap(src.lat, src.lon);
  const oLat = state.originLat, oLon = state.originLon, mLon = mPerDegLonAt(oLat);
  const fullPts = route.geometry.coordinates.map(([lon, lat]) => ({ x: (lon - oLon) * mLon, y: (lat - oLat) * M_PER_DEG_LAT }));

  // OSRM steps -> maneuvers anchored to the nearest full-geometry vertex (searching forward)
  const rawManeuvers = [];
  let searchFrom = 0;
  route.legs.forEach((leg, li) => {
    const lastLeg = li === route.legs.length - 1;
    for (const step of leg.steps) {
      const t = step.maneuver.type;
      if (t === "depart" || t === "new name" || t === "notification") continue;
      const mod = step.maneuver.modifier || "straight";
      if (t === "continue" && mod === "straight") continue;
      const [mlon, mlat] = step.maneuver.location;
      const mx = (mlon - oLon) * mLon, my = (mlat - oLat) * M_PER_DEG_LAT;
      let best = searchFrom, bestD = Infinity;
      for (let i = searchFrom; i < fullPts.length; i++) {
        const d = (fullPts[i].x - mx) ** 2 + (fullPts[i].y - my) ** 2;
        if (d < bestD) { bestD = d; best = i; }
        if (bestD < 1 && d > 400 * 400) break;
      }
      searchFrom = best;
      const arriveName = lastLeg ? dest.label : (via[li] ? via[li].label : `Stop ${li + 1}`);
      rawManeuvers.push({
        idx: best,
        id: t === "arrive" ? 9 : (OSRM_MODIFIER_TO_ID[mod] ?? 1),
        name: (t === "arrive" ? arriveName : (step.name || step.ref || step.destinations || "")).slice(0, 31)
      });
    }
  });

  const simp = simplifyRouteForDevice(fullPts, rawManeuvers.map((m) => m.idx), DEVICE_MAX_ROUTE_VERTS);
  const maneuvers = rawManeuvers.map((m) => ({ ...m, idx: simp.remap.get(m.idx) ?? simp.pts.length - 1 }));
  if (fullPts.some((p) => Math.abs(p.x) > 32767 || Math.abs(p.y) > 32767)) {
    logMsg("Warning: route extends > 32 km from its origin; the HUD clamps coordinates beyond that.");
  }

  setNavRoute(simp.pts, maneuvers, route.duration);
  state.hasRealRoute = true;
  if (!keepOrigin && !roads.center) state.speedLimitMph = 0; // unknown until a road with a maxspeed tag is under the player
  nav.progressM = 0;
  state.gpsOrigin = true;
  autoDrive = simulating;
  updatePauseBtn();
  if (gpsWatchId !== null && currentGpsCoords) {
    state.playerX = (currentGpsCoords.lon - oLon) * mLon;
    state.playerY = (currentGpsCoords.lat - oLat) * M_PER_DEG_LAT;
    locateOnRoute(state.playerX, state.playerY);
  }
  updateSimulation(0);

  logMsg(`Route ready: ${fullPts.length} -> ${simp.pts.length} pts (tol ${simp.tol.toFixed(1)} m), ` +
         `${maneuvers.length} maneuvers, ${(nav.total / 1609.34).toFixed(1)} mi, ${Math.round(route.duration / 60)} min.`);
  sendRouteOverBle();
  if (!keepOrigin) await ensureRoadsAround(src.lat, src.lon);
}

// Installable app (Android share target); network-first so updates show up immediately
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

// ============================================================================
// App UI: radar, turn card, "Where to?" sheet, recent places, developer options
// ============================================================================
let simulating = false;      // developer: simulated drive (also fed to the HUD)
let currentBaseScale = 1.35; // smoothed m/px shared by the radar and the HUD preview
let resumeTrip = null;
let lastUi = "";

const radarCanvas = document.getElementById("radar");
const rc = radarCanvas.getContext("2d");
let radarCss = 280, radarDpr = 1;

function sizeRadar() {
  radarCss = radarCanvas.clientWidth || 280;
  radarDpr = Math.min(3, window.devicePixelRatio || 1);
  radarCanvas.width = Math.round(radarCss * radarDpr);
  radarCanvas.height = Math.round(radarCss * radarDpr);
}
window.addEventListener("resize", sizeRadar);
if ("ResizeObserver" in window) new ResizeObserver(sizeRadar).observe(radarCanvas);

// Cached bounding box of a point list (roads use w.pts, areas are plain arrays)
function ptsBounds(pts) {
  if (!pts.bb) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
    pts.bb = [x0, y0, x1, y1];
  }
  return pts.bb;
}
const wayBounds = (w) => ptsBounds(w.pts);

// GTA V-style radar palette, pushed for contrast, drawn with bold "ink" outlines (GTA's
// cartoon map art): every road and building gets a dark casing so the map reads at a glance
const RADAR = {
  land: "#20242a", block: "#3d434c", ink: "#0d0f12", park: "#2f5d3b", water: "#1d4f7d",
  local: "#8a9199", art: "#cdd2d8", hwy: "#f5f6f7",
  route: "#b45cff", routeCasing: "#14061f", rim: "#0b0c0e", rimInner: "rgba(255,255,255,0.16)", vignette: 0.3
};

// GTA-style circular radar: map rotates with heading, player in the centre, N on the rim
function renderRadar() {
  const S = radarCss, cx = S / 2, cy = S / 2, R = S / 2 - 6, g = rc;
  g.setTransform(radarDpr, 0, 0, radarDpr, 0, 0);
  g.clearRect(0, 0, S, S);
  g.save();
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip();
  g.fillStyle = RADAR.land; g.fillRect(0, 0, S, S);
  const rad = (state.headingDeg * Math.PI) / 180;

  if (simulating || state.hasRealRoute || currentGpsCoords) {
    const mPerPx = currentBaseScale * 0.9;
    const cosH = Math.cos(rad) / mPerPx, sinH = Math.sin(rad) / mPerPx;
    const px = state.playerX, py = state.playerY, reach = R * mPerPx * 1.05;
    const P = (wx, wy) => { const dx = wx - px, dy = wy - py; return [cx + (dx * cosH - dy * sinH), cy - (dx * sinH + dy * cosH)]; };
    const boost = Math.min(1.8, Math.max(0.8, Math.pow(1.1 / currentBaseScale, 0.5)));
    const stroke = (pts) => {
      g.beginPath();
      pts.forEach((pt, i) => { const [x, y] = P(pt.x, pt.y); if (i) g.lineTo(x, y); else g.moveTo(x, y); });
      g.stroke();
    };
    const near = (pts) => {
      const [x0, y0, x1, y1] = ptsBounds(pts);
      return x1 > px - reach && x0 < px + reach && y1 > py - reach && y0 < py + reach;
    };
    const fillAreas = (list, color, edge) => {
      g.fillStyle = color;
      if (edge) { g.strokeStyle = edge; g.lineWidth = 1.4; }
      for (const pts of list) {
        if (!near(pts)) continue;
        g.beginPath();
        pts.forEach((pt, i) => { const [x, y] = P(pt.x, pt.y); if (i) g.lineTo(x, y); else g.moveTo(x, y); });
        g.closePath();
        g.fill("evenodd");
        if (edge) g.stroke();
      }
    };
    fillAreas(state.areas.water, RADAR.water);
    fillAreas(state.areas.parks, RADAR.park);
    fillAreas(state.areas.blocks, RADAR.block, RADAR.ink);
    g.lineCap = "round"; g.lineJoin = "round";
    const visible = state.ways.filter((w) => {
      if (w.pts.length < 2) return false;
      const [x0, y0, x1, y1] = wayBounds(w);
      return x1 > px - reach && x0 < px + reach && y1 > py - reach && y0 < py + reach;
    });
    // Ink casings under every road, then the cores
    const coreW = (t) => (t === 3 ? 7.5 : (t === 2 ? 5.5 : 3.4)) * boost;
    g.strokeStyle = RADAR.ink;
    for (const w of visible) { g.lineWidth = coreW(w.tier) + 3.5 * boost; stroke(w.pts); }
    for (const w of visible) {
      g.strokeStyle = w.tier === 3 ? RADAR.hwy : (w.tier === 2 ? RADAR.art : RADAR.local);
      g.lineWidth = coreW(w.tier);
      stroke(w.pts);
    }
    if (state.routePts.length >= 2) {
      const route = [{ x: px, y: py }, ...state.routePts.slice(state.closestRouteIdx)];
      g.strokeStyle = RADAR.routeCasing; g.lineWidth = 12 * boost; stroke(route);
      g.strokeStyle = RADAR.route; g.lineWidth = 7 * boost; stroke(route);
      const edge = ([x, y]) => {
        const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy), m = R - 15;
        return d > m ? [cx + (dx * m) / d, cy + (dy * m) / d] : [x, y];
      };
      const last = state.routePts.length - 1;
      if (state.nextWpIdx < last) {
        const [x, y] = edge(P(state.routePts[state.nextWpIdx].x, state.routePts[state.nextWpIdx].y));
        g.fillStyle = "#000"; g.fillRect(x - 8, y - 8, 16, 16);
        g.fillStyle = "#E52521"; g.fillRect(x - 6, y - 6, 12, 12);
        g.fillStyle = "#FFD700"; g.fillRect(x - 3, y - 3, 6, 6);
      }
      const [dx, dy] = edge(P(state.routePts[last].x, state.routePts[last].y));
      for (const [r, c] of [[10, "#000"], [8, RADAR.route], [6, "#000"], [4, RADAR.route]]) {
        g.fillStyle = c; g.beginPath(); g.arc(dx, dy, r, 0, Math.PI * 2); g.fill();
      }
    }
  } else {
    // No position yet: subtle grid + hint
    g.strokeStyle = "rgba(255,255,255,0.05)"; g.lineWidth = 1;
    for (let i = -S; i < S * 2; i += 26) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i + S * 0.3, S); g.stroke();
      g.beginPath(); g.moveTo(0, i); g.lineTo(S, i - S * 0.2); g.stroke();
    }
    g.fillStyle = "#8e929b"; g.font = `600 14px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(gpsWatchId !== null ? "Locating…" : "Your location appears here", cx, cy + 40);
  }
  const vg = g.createRadialGradient(cx, cy, R * 0.55, cx, cy, R);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, `rgba(0,0,0,${RADAR.vignette})`);
  g.fillStyle = vg; g.fillRect(0, 0, S, S);
  g.restore();

  // Rim, north marker, player arrow
  g.lineWidth = 9; g.strokeStyle = RADAR.rim; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
  g.lineWidth = 2; g.strokeStyle = RADAR.rimInner; g.beginPath(); g.arc(cx, cy, R - 5, 0, Math.PI * 2); g.stroke();
  const nx = cx - Math.sin(rad) * R, ny = cy - Math.cos(rad) * R;
  g.fillStyle = "#000"; g.beginPath(); g.arc(nx, ny, 11, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "#fff"; g.lineWidth = 1.5; g.stroke();
  g.fillStyle = "#fff"; g.font = `800 12px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("N", nx, ny + 0.5);
  g.fillStyle = "#000"; g.beginPath(); g.moveTo(cx, cy - 14); g.lineTo(cx - 11, cy + 11); g.lineTo(cx + 11, cy + 11); g.fill();
  g.fillStyle = "#fff"; g.beginPath(); g.moveTo(cx, cy - 10); g.lineTo(cx - 7.5, cy + 7.5); g.lineTo(cx, cy + 3); g.lineTo(cx + 7.5, cy + 7.5); g.fill();
}

// Turn card + speed bubble; DOM only touched when something visible changed
const turnIconCtx = document.getElementById("turnIcon").getContext("2d");
function renderStatusUi() {
  const navigating = !!(activeTrip && !activeTrip.arrived && state.routePts.length >= 2);
  const mph = Math.round(state.speedMph), lim = state.speedLimitMph;
  const key = [navigating, state.maneuverId, Math.round(state.turnDistM / 10), state.streetName, state.etaMinutes,
               Math.round(state.destDistM / 160), mph, lim, activeTrip ? activeTrip.arrived : "-"].join("|");
  if (key === lastUi) return;
  lastUi = key;
  document.getElementById("speedVal").textContent = mph;
  document.getElementById("speedChip").classList.toggle("over", lim > 0 && mph > lim + 5);
  const lc = document.getElementById("limitChip");
  lc.hidden = !(lim > 0);
  lc.textContent = lim > 0 ? lim : "";
  document.getElementById("turnCard").hidden = !navigating;
  if (navigating) {
    document.getElementById("turnDist").textContent =
      state.maneuverId === 9 && state.turnDistM < 30 ? "Arrived" : formatTurnDist(state.turnDistM, 50);
    document.getElementById("turnStreet").textContent = state.streetName;
    const [num, unit] = etaParts();
    document.getElementById("etaMin").textContent = `${num} ${unit}`;
    document.getElementById("etaDist").textContent = `${(state.destDistM / 1609.34).toFixed(1)} mi`;
    // Both bars drain like GTA health/armor: green = trip remaining, blue = distance to the next turn (500 m scale)
    const tripLeft = nav.total > 0 ? Math.max(0, Math.min(1, state.destDistM / nav.total)) : 1;
    document.getElementById("barTrip").style.width = `${Math.round(tripLeft * 100)}%`;
    document.getElementById("barTurn").style.width = `${Math.round(Math.min(1, state.turnDistM / 500) * 100)}%`;
    turnIconCtx.setTransform(1, 0, 0, 1, 0, 0);
    turnIconCtx.clearRect(0, 0, 104, 104);
    drawManeuverArrow(52, 52, 64, state.maneuverId || 1, "#FFB800", "#000", turnIconCtx);
  }
  updateSheet();
}

// ---------- "Where to?" sheet ----------
const RECENT_KEY = "gtaHudRecent";
function loadRecents() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch { return []; }
}

function addRecent(p) {
  const list = loadRecents().filter((r) => r.label !== p.label);
  list.unshift({ label: p.label, lat: p.lat, lon: p.lon });
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 6))); } catch { /* private mode */ }
  renderRecents();
}

function renderRecents() {
  const box = document.getElementById("recentChips");
  box.textContent = "";
  const items = [];
  if (resumeTrip) items.push({ label: `Resume: ${placeLabel(resumeTrip.dest)}`, trip: resumeTrip, cls: "resume" });
  for (const r of loadRecents()) {
    if (resumeTrip && r.label === placeLabel(resumeTrip.dest)) continue; // already offered as "Resume"
    items.push({ label: r.label, trip: { dest: { lat: r.lat, lon: r.lon, name: r.label }, via: [] } });
  }
  for (const it of items) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = `chip ${it.cls || ""}`;
    b.textContent = it.label;
    b.addEventListener("click", () => setPendingTrip(it.trip));
    box.appendChild(b);
  }
  const show = items.length > 0 && !activeTrip;
  box.hidden = !show;
  document.getElementById("recentLabel").hidden = !show;
}

function setHint(text) {
  document.getElementById("hint").textContent = text;
}

function setPendingTrip(trip) {
  pendingTrip = trip;
  document.getElementById("inpDest").value = placeLabel(trip.dest);
  document.getElementById("tripSub").textContent = trip.via.length ? `via ${trip.via.map(placeLabel).join(" → ")}` : "";
  setHint("");
  updateSheet();
}

function updateSheet() {
  const navigating = !!(activeTrip && !activeTrip.arrived);
  const arrived = !!(activeTrip && activeTrip.arrived);
  const kicker = document.getElementById("sheetKicker");
  const title = document.getElementById("sheetTitle");
  const cta = document.getElementById("btnStart");
  if (cta.disabled) return; // "Starting…"
  if (navigating) {
    kicker.textContent = "Navigating to";
    title.textContent = activeTrip.dest.label;
    cta.textContent = "End trip";
  } else if (arrived) {
    kicker.textContent = "You've arrived at";
    title.textContent = activeTrip.dest.label;
    cta.textContent = "Done";
  } else {
    kicker.textContent = pendingTrip ? "Ready to go" : "";
    title.textContent = "Where to?";
    cta.textContent = "Start";
  }
  cta.classList.toggle("dark", navigating || arrived);
  document.querySelector(".sheet").classList.toggle("is-trip", navigating || arrived);
  document.querySelector(".app").classList.toggle("nav-mode", navigating || arrived);
  document.getElementById("inpDest").disabled = navigating;
  document.getElementById("inpStart").disabled = navigating;
  const showRecents = !activeTrip && document.getElementById("recentChips").childElementCount > 0;
  document.getElementById("recentChips").hidden = !showRecents;
  document.getElementById("recentLabel").hidden = !showRecents;
}

function endTrip() {
  activeTrip = null;
  pendingTrip = null;
  clearSavedTrip();
  state.hasRealRoute = false;
  state.routePts = [];
  nav.maneuvers = [];
  nav.cum = [0];
  nav.total = 0;
  state.maneuverId = 0;
  state.turnDistM = 0;
  state.destDistM = 0;
  state.etaMinutes = 0;
  state.streetName = "";
  document.getElementById("inpDest").value = "";
  document.getElementById("tripSub").textContent = "";
  sendClearRouteOverBle();
  renderRecents();
  lastUi = "";
  updateSheet();
  logMsg("Trip ended.");
}

document.getElementById("btnStart").addEventListener("click", () => {
  if (activeTrip) { endTrip(); return; }
  const typed = document.getElementById("inpDest").value.trim();
  const trip = pendingTrip && typed === placeLabel(pendingTrip.dest) ? pendingTrip : (typed ? parseTripInput(typed) : null);
  if (!trip || !trip.dest) {
    setHint("Enter a destination, pick a recent place, or share one from Maps.");
    document.getElementById("inpDest").focus();
    return;
  }
  setHint("");
  startTrip(trip);
});

document.getElementById("inpDest").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    document.getElementById("btnStart").click();
  }
});

document.getElementById("inpDest").addEventListener("input", () => {
  document.getElementById("tripSub").textContent = "";
  if (pendingTrip) { pendingTrip = null; updateSheet(); }
});

function updateLinkUi() {
  const on = ble.connected;
  document.getElementById("linkDot").classList.toggle("on", on);
  document.getElementById("btDot").classList.toggle("on", on);
  document.getElementById("linkText").textContent = on ? "HUD connected" : "HUD not connected";
}

// ---------- developer options: simulated drive ----------
function updatePauseBtn() {
  const b = document.getElementById("btnSimPause");
  b.textContent = autoDrive ? "⏸ Pause" : "▶ Resume";
  b.disabled = !simulating;
}

function setSimulating(on) {
  simulating = on;
  const b = document.getElementById("btnSimDrive");
  b.textContent = on ? "■ Stop simulation" : "▶ Simulate drive";
  b.classList.toggle("active", on);
  if (on) {
    stopGpsTracking();
    if (state.routePts.length < 2) {
      buildDemoGrid();
      loadDemoRoute();
      state.speedLimitMph = 40;
    }
    state.speedMph = Number(document.getElementById("rngSpeed").value);
    autoDrive = true;
    logMsg("Simulating a drive (sent to the HUD while on).");
  } else {
    autoDrive = false;
    if (!state.hasRealRoute) {
      state.routePts = [];
      nav.maneuvers = [];
      nav.cum = [0];
      nav.total = 0;
      clearMapCache();
      state.maneuverId = 0;
      state.turnDistM = 0;
      state.destDistM = 0;
      state.streetName = "";
      state.speedMph = 0;
      state.speedLimitMph = 0;
      state.gpsOrigin = false;
    }
    logMsg("Simulation stopped; following the real vehicle.");
    autoStartGps();
  }
  updatePauseBtn();
  ble.lastTileKey = null;
  lastUi = "";
  sendRouteOverBle();
}

// GPS starts by itself when location access was already granted; otherwise with the first trip
async function autoStartGps() {
  if (gpsWatchId !== null || simulating || !("geolocation" in navigator)) return;
  try {
    const p = await navigator.permissions.query({ name: "geolocation" });
    if (p.state === "granted") startGpsTracking();
  } catch { /* Permissions API unavailable: GPS starts with the first trip */ }
}

sizeRadar();
renderRecents();
updateLinkUi();
updatePauseBtn();
updateSheet();
checkIncomingTrip();
autoStartGps();
</script>
