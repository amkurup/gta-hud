<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b0d12" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>ESP32 GTA San Andreas HUD — WebBLE Companion & HUD Simulator</title>
<style>
  :root {
    --bg: #0b0d12;
    --gold: #ffb800;
    --gold-press: #e6a600;
    --ink: #0b0b0f;
    --field: #f2f3f5;
    --muted: #8e929b;
    --line: #e6e7eb;
    --ok: #00e676;
    --bad: #ff3b30;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }
  .app { width: 100%; max-width: 480px; min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- top: radar ---------- */
  .top { --rw: min(76vw, 300px); padding: calc(env(safe-area-inset-top) + 14px) 18px 30px; color: #fff; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: 0.01em; }
  .brand svg { width: 26px; height: 26px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #fff;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: 0 0 auto; }
  .dot.on { background: var(--ok); box-shadow: 0 0 10px rgba(0, 230, 118, 0.8); }

  .turn-card {
    display: flex; align-items: center; gap: 12px; margin-top: 16px;
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px; padding: 10px 14px 10px 10px;
  }
  .turn-card[hidden] { display: none; }
  .turn-card canvas { width: 52px; height: 52px; border-radius: 16px; background: #000; flex: 0 0 auto; }
  .turn-main { flex: 1; min-width: 0; }
  .turn-dist { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
  .turn-street { font-size: 14px; color: #c8ccd4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .turn-eta { text-align: right; font-size: 13px; color: #c8ccd4; }
  .turn-eta b { display: block; font-size: 20px; color: var(--gold); }

  .radar-wrap { position: relative; display: flex; justify-content: center; margin-top: 18px; }
  #radar { width: var(--rw); aspect-ratio: 1; display: block; transition: width 0.45s ease; }
  .speed-chip {
    position: absolute; left: calc(50% - var(--rw) / 2 - 6px); bottom: -4px; transition: left 0.45s ease;
    width: 70px; height: 70px; border-radius: 50%;
    background: #141821; border: 3px solid rgba(255, 255, 255, 0.12);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
  }
  .speed-chip b { font-size: 24px; line-height: 1; }
  .speed-chip span { font-size: 10px; color: #9aa0ab; font-weight: 600; letter-spacing: 0.06em; }
  .speed-chip.over { border-color: var(--bad); }
  .limit-chip {
    position: absolute; left: calc(50% - var(--rw) / 2 + 52px); bottom: 44px; transition: left 0.45s ease;
    width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #000;
    border: 3px solid var(--bad); font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .limit-chip[hidden] { display: none; }

  /* GTA V-style health/armor bars under the minimap: trip progress (green), next-turn approach (blue) */
  .gta-bars { display: none; gap: 6px; width: var(--rw); margin: 14px auto 0; transition: width 0.45s ease; }
  .gta-bar { flex: 1; height: 12px; background: rgba(0, 0, 0, 0.55); border: 2px solid #000; border-radius: 2px; overflow: hidden; }
  .gta-bar > i { display: block; height: 100%; width: 0; background: #57a64d; transition: width 0.6s; }
  .gta-bar.armor > i { background: #4a8fd8; }

  /* Navigation: the radar is front and centre, the sheet shrinks to a compact dark bar */
  .app.nav-mode .top { --rw: min(calc(100vw - 24px), 456px); flex: 1; display: flex; flex-direction: column; padding-inline: 12px; padding-bottom: 22px; }
  .app.nav-mode .radar-wrap { margin-top: auto; padding-top: 18px; }
  .app.nav-mode .gta-bars { display: flex; margin-bottom: auto; }
  .app.nav-mode .sheet { flex: 0 0 auto; padding-top: 8px; }
  .app.nav-mode .sheet h1 { font-size: 24px; margin-bottom: 10px; }
  .app.nav-mode .cta-row { margin-top: 10px; }
  .app.nav-mode .links { display: none; }

  /* ---------- bottom sheet ---------- */
  .sheet {
    background: #fff; border-radius: 34px 34px 0 0; flex: 1;
    padding: 10px 18px calc(env(safe-area-inset-bottom) + 22px);
    box-shadow: 0 -12px 34px rgba(0, 0, 0, 0.35);
  }
  .grabber { width: 44px; height: 5px; border-radius: 3px; background: #d9dadf; margin: 0 auto 14px; }
  .kicker { font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 6px; min-height: 18px; }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 6px 16px; line-height: 1.1; }
  .field {
    display: flex; align-items: center; gap: 10px;
    background: var(--field); border-radius: 999px; height: 60px; padding: 0 10px 0 24px; margin-bottom: 12px;
  }
  .field input {
    flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
    font-size: 17px; font-family: inherit; color: var(--ink);
  }
  .field input::placeholder { color: #a6a9b0; }
  .field .ico { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #9a9ea6; border: 0; background: transparent; border-radius: 50%; }
  .field button.ico:active { background: #e3e4e8; }
  .field .ico svg { width: 22px; height: 22px; }
  .via { font-size: 13px; color: var(--muted); margin: -4px 8px 8px; }
  .sheet.is-trip .field, .sheet.is-trip .via { display: none; }
  /* During a trip the sheet goes dark so the screen isn't a bright white panel while driving */
  .sheet { transition: background-color 0.4s, color 0.4s; }
  .sheet.is-trip { background: #14161b; color: #f3f4f6; box-shadow: 0 -12px 34px rgba(0, 0, 0, 0.6); }
  .sheet.is-trip .grabber { background: #2a2e36; }
  .sheet.is-trip .kicker, .sheet.is-trip .hint { color: #7d828c; }
  .sheet.is-trip .cta.dark { background: #24272e; color: #f3f4f6; }
  .sheet.is-trip .round { background: #24272e; }
  .sheet.is-trip .round .dot { border-color: #24272e; }
  .sheet.is-trip .links a, .sheet.is-trip details.dev > summary { color: #555a63; }
  .via:empty { display: none; }
  .section-label { font-weight: 700; font-size: 15px; margin: 16px 6px 10px; }
  .section-label[hidden], .chips[hidden] { display: none; }
  .chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; max-width: 190px; background: var(--field); border: 0; border-radius: 999px;
    padding: 16px 22px; font-size: 15px; font-weight: 650; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip.resume { background: #fff4d6; }
  .chip:active { background: #e3e4e8; }
  .cta-row { display: flex; gap: 12px; margin-top: 20px; align-items: center; }
  .cta {
    flex: 1; height: 66px; border-radius: 999px; border: 0; background: var(--gold); color: #000;
    font-size: 19px; font-weight: 800; letter-spacing: 0.01em;
  }
  .cta:active { background: var(--gold-press); }
  .cta.dark { background: #16181d; color: #fff; }
  .round {
    width: 66px; height: 66px; border-radius: 50%; border: 0; background: var(--ink); color: #fff;
    position: relative; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .round svg { width: 26px; height: 26px; }
  .round .dot { position: absolute; top: 13px; right: 13px; border: 2px solid var(--ink); width: 13px; height: 13px; }
  .hint { min-height: 18px; margin: 10px 8px 0; font-size: 13px; color: var(--muted); }
  .links { display: flex; justify-content: center; gap: 18px; margin-top: 18px; font-size: 13px; }
  .links a, .links summary { color: var(--muted); text-decoration: none; font-weight: 600; }

  /* ---------- developer options ---------- */
  details.dev { margin-top: 14px; }
  details.dev > summary { list-style: none; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
  details.dev > summary::-webkit-details-marker { display: none; }
  .dev-body { margin-top: 12px; background: #f6f7f9; border: 1px solid var(--line); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .dev-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  canvas#hudCanvas { width: 100%; height: auto; background: #000; border-radius: 10px; display: block; cursor: pointer; }
  .dev-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .dev-row button, .dev-row select {
    background: #fff; color: var(--ink); border: 1px solid #d9dbe0; border-radius: 999px;
    padding: 9px 14px; font-size: 13px; font-weight: 600; font-family: inherit;
  }
  .dev-row button.active { border-color: var(--gold); background: #fff4d6; }
  .dev label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .dev input[type="range"] { width: 100%; accent-color: var(--gold); }
  .status-log {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: #3a4252;
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px; height: 120px;
    overflow-y: auto; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="app">
  <section class="top">
    <div class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2.5 20 21l-8-5.2L4 21z" fill="#FFB800"/></svg>
        GTA HUD
      </div>
      <button class="pill" id="linkPill" type="button"><span class="dot" id="linkDot"></span><span id="linkText">HUD not connected</span></button>
    </div>

    <div class="turn-card" id="turnCard" hidden>
      <canvas id="turnIcon" width="104" height="104"></canvas>
      <div class="turn-main">
        <div class="turn-dist" id="turnDist">—</div>
        <div class="turn-street" id="turnStreet"></div>
      </div>
      <div class="turn-eta"><b id="etaMin">—</b><span id="etaDist"></span></div>
    </div>

    <div class="radar-wrap">
      <canvas id="radar"></canvas>
      <div class="speed-chip" id="speedChip"><b id="speedVal">0</b><span>MPH</span></div>
      <div class="limit-chip" id="limitChip" hidden></div>
    </div>
    <div class="gta-bars">
      <div class="gta-bar" title="Trip remaining"><i id="barTrip"></i></div>
      <div class="gta-bar armor" title="Distance to next turn"><i id="barTurn"></i></div>
    </div>
  </section>

  <section class="sheet">
    <div class="grabber"></div>
    <div class="kicker" id="sheetKicker"></div>
    <h1 id="sheetTitle">Where to?</h1>

    <div class="field">
      <input id="inpStart" type="text" placeholder="Current location" autocomplete="off" />
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </span>
    </div>
    <div class="field">
      <input id="inpDest" type="text" placeholder="Where are you going?" autocomplete="off" enterkeyhint="go" />
      <button class="ico" id="btnPasteTrip" type="button" title="Paste a Maps link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2.5"/><path d="M9 4.5V3h6v1.5M9.5 10h5M9.5 14h5"/></svg>
      </button>
    </div>
    <div class="via" id="tripSub"></div>

    <div class="section-label" id="recentLabel" hidden>Recent places</div>
    <div class="chips" id="recentChips" hidden></div>

    <div class="cta-row">
      <button class="cta" id="btnStart" type="button">Start</button>
      <button class="round" id="btnConnectBle" type="button" title="Connect HUD">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>
        <span class="dot" id="btDot"></span>
      </button>
    </div>
    <div class="hint" id="hint"></div>

    <div class="links">
      <a href="setup.html">Set up "Send to HUD"</a>
    </div>

    <details class="dev" id="devPanel">
      <summary>Developer options</summary>
      <div class="dev-body">
        <div class="dev-head"><span id="modeBadge">NORMAL MODE · MAP VIEW</span><span>HUD screen preview</span></div>
        <canvas id="hudCanvas" width="320" height="172"></canvas>
        <div class="dev-row">
          <select id="selDisplay">
            <option value="compact">Waveshare C6 1.47" (320x172)</option>
            <option value="full">Hosyond S3 4.0" (480x320)</option>
          </select>
          <button id="btnToggleMode" type="button">Switch to Turn View</button>
          <button id="btnMirror" type="button">HUD Mode</button>
        </div>
        <div class="dev-row">
          <button id="btnSimDrive" type="button">▶ Simulate drive</button>
          <button id="btnSimPause" type="button">⏸ Pause</button>
          <button id="btnLiveGpsTrack" type="button">Live GPS: Off</button>
        </div>
        <div>
          <label><span>Speed</span><span id="lblSpeed">38 mph</span></label>
          <input type="range" id="rngSpeed" min="0" max="80" step="0.5" value="38" />
        </div>
        <div>
          <label><span>Heading</span><span id="lblHeading">0°</span></label>
          <input type="range" id="rngHeading" min="0" max="359" value="0" />
        </div>
        <div>
          <label><span>Route progress</span><span id="lblProgress">0%</span></label>
          <input type="range" id="rngProgress" min="0" max="100" value="0" />
        </div>
        <div class="status-log" id="statusLog">Ready.</div>
      </div>
    </details>
  </section>
</div>

<script>
"use strict";
// ============================================================================
// Protocol constants (must match src/ble_protocol.h)
// ============================================================================
const SERVICE_UUID        = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const CHAR_TELEMETRY_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const CHAR_GEOMETRY_UUID  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const PKT_TELEMETRY = 0x01, PKT_STREET_NAME = 0x02, PKT_ROUTE_POLYLINE = 0x10, PKT_ROAD_TILE = 0x20;
// Area polygons ride in the road tiles as extra "tiers" (firmware AreaTier), drawn in this order
const AREA_TIER_BUILDING = 16, AREA_TIER_PARK = 17, AREA_TIER_WATER = 18;
const TILE_LON_E7 = 50000, TILE_LAT_E7 = 45000;
const M_PER_DEG_LAT = 111132.92;
const mPerDegLonAt = (latDeg) => 111412.84 * Math.cos((latDeg * Math.PI) / 180);

// Limits of the smallest target (ESP32-C6): MAX_ROUTE_VERTICES and REASSEMBLY_BUF_SIZE
const DEVICE_MAX_ROUTE_VERTS = 512;
const DEVICE_MAX_TILE_BYTES  = 8000;
// iOS typically negotiates MTU 185 -> 182-byte ATT payload; 6-byte chunk header + 176 data
const BLE_CHUNK_PAYLOAD = 176;
const TELEMETRY_PERIOD_MS = 200;

const canvas = document.getElementById("hudCanvas");
const ctx = canvas.getContext("2d");

let displayMode = 0; // 0 = Mode A (GTA Map), 1 = Mode B (Full-Screen Turn Arrow)
let autoDrive = false;
let smoothedScale = 1.35;

// Shared state matching the firmware's HudRuntimeState
const state = {
  originLat: 42.3314,
  originLon: -83.0458,
  playerX: 0,
  playerY: 0,
  headingDeg: 0,
  speedMph: 0,
  speedLimitMph: 0,
  maneuverId: 0,
  turnDistM: 0,
  destDistM: 0,
  etaMinutes: 0,
  streetName: "",
  nextWpIdx: 0,
  closestRouteIdx: 0,
  gpsOrigin: false, // origin re-anchored to the first GPS fix when there's no route
  areas: { blocks: [], parks: [], water: [] }, // app radar (and, clipped per tile, the HUD map detail)
  routePts: [],
  ways: [],          // { tier, pts: [{x,y}] } in session meters (for the simulator)
  tileRuns: new Map(), // "tx,ty" -> [{ tier, ll: [[lat,lon],...] }] (for streaming to the HUD)
  tileAreas: new Map(), // "tx,ty" -> [{ tier: 16|17|18, ll: [[lat,lon],...] }] clipped to the tile
  hasRealRoute: false
};

// Along-route navigation model
const nav = { cum: [0], total: 0, durationS: 0, maneuvers: [], progressM: 0, segIdx: 0 };

function logMsg(msg) {
  const el = document.getElementById("statusLog");
  const ts = new Date().toLocaleTimeString();
  el.textContent = `[${ts}] ${msg}\n` + el.textContent;
}

// ============================================================================
// Built-in demo city (matches the firmware's loadBuiltInDemoCityGrid)
// ============================================================================
function buildDemoGrid() {
  state.ways = [];
  for (let i = -8; i <= 8; i++) {
    const y = i * 55;
    state.ways.push({ tier: (i === 0 || i === 3) ? 2 : 1, pts: [{ x: -500, y: y - i * 8 }, { x: 500, y: y + i * 12 }] });
  }
  for (let i = -8; i <= 8; i++) {
    const x = i * 55;
    state.ways.push({ tier: (i === -1 || i === 2) ? 2 : 1, pts: [{ x: x - 15, y: -500 }, { x: x + 25, y: 550 }] });
  }
  state.ways.push(
    { tier: 3, pts: [{ x: -450, y: -320 }, { x: 390, y: 490 }] },
    { tier: 3, pts: [{ x: -460, y: 130 }, { x: 430, y: 410 }] },
    { tier: 2, pts: [{ x: -20, y: -380 }, { x: 125, y: 470 }] },
    { tier: 2, pts: [{ x: -290, y: -380 }, { x: -65, y: 440 }] },
    { tier: 2, pts: [{ x: 210, y: -360 }, { x: -160, y: 400 }] }
  );
  // Stream the same grid to the HUD as real tiles (the device drops its own demo grid on route upload)
  const mLon = mPerDegLonAt(state.originLat);
  state.tileRuns = indexWaysIntoTiles(state.ways.map((w) => ({
    tier: w.tier,
    ll: w.pts.map((p) => [state.originLat + p.y / M_PER_DEG_LAT, state.originLon + p.x / mLon])
  })));
  state.tileAreas = new Map(); // synthetic grid: no real buildings to line up with
}

function loadDemoRoute() {
  const pts = [
    { x: 0, y: -160 }, { x: 0, y: -45 }, { x: 4, y: 35 }, { x: 24, y: 95 }, { x: 20, y: 145 },
    { x: 74, y: 162 }, { x: 88, y: 235 }, { x: 105, y: 295 }, { x: 132, y: 315 }, { x: 122, y: 390 }
  ];
  setNavRoute(pts, [
    { idx: 5, id: 7, name: "Woodward Ave" },
    { idx: 9, id: 9, name: "Destination" }
  ], 0);
  nav.progressM = nav.total * 0.18;
}

// ============================================================================
// Navigation model: cumulative distance, progress, next maneuver, ETA
// ============================================================================
function setNavRoute(pts, maneuvers, durationS) {
  state.routePts = pts;
  nav.cum = [0];
  for (let i = 1; i < pts.length; i++) {
    nav.cum.push(nav.cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  }
  nav.total = nav.cum[nav.cum.length - 1] || 0;
  nav.durationS = durationS > 0 ? durationS : nav.total / 13.4;
  nav.maneuvers = maneuvers.length ? maneuvers : [{ idx: pts.length - 1, id: 9, name: "Destination" }];
  nav.progressM = 0;
  nav.segIdx = 0;
}

function positionAtProgress(d) {
  const pts = state.routePts;
  d = Math.max(0, Math.min(nav.total, d));
  let i = Math.min(nav.segIdx, pts.length - 2);
  while (i > 0 && nav.cum[i] > d) i--;
  while (i < pts.length - 2 && nav.cum[i + 1] < d) i++;
  const segLen = nav.cum[i + 1] - nav.cum[i] || 1;
  const t = (d - nav.cum[i]) / segLen;
  return {
    seg: i,
    x: pts[i].x + (pts[i + 1].x - pts[i].x) * t,
    y: pts[i].y + (pts[i + 1].y - pts[i].y) * t,
    headingDeg: ((Math.atan2(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y) * 180) / Math.PI + 360) % 360
  };
}

// Map-match a free position (GPS) onto the route near the previous progress
function locateOnRoute(x, y) {
  const pts = state.routePts;
  if (pts.length < 2) return;
  const search = (from, to) => {
    let best = { d2: Infinity, seg: nav.segIdx, along: nav.progressM };
    for (let i = Math.max(0, from); i < Math.min(pts.length - 1, to); i++) {
      const ax = pts[i].x, ay = pts[i].y, bx = pts[i + 1].x, by = pts[i + 1].y;
      const sx = bx - ax, sy = by - ay;
      const len2 = sx * sx + sy * sy || 1;
      const t = Math.max(0, Math.min(1, ((x - ax) * sx + (y - ay) * sy) / len2));
      const px = ax + sx * t, py = ay + sy * t;
      const d2 = (x - px) ** 2 + (y - py) ** 2;
      if (d2 < best.d2) best = { d2, seg: i, along: nav.cum[i] + Math.sqrt(len2) * t };
    }
    return best;
  };
  let best = search(nav.segIdx - 3, nav.segIdx + 60);
  if (best.d2 > 80 * 80) best = search(0, pts.length - 1); // off-route or jumped: global search
  nav.segIdx = best.seg;
  nav.progressM = best.along;
  nav.offRouteM = Math.sqrt(best.d2);
}

function updateNavDerivedState() {
  const pts = state.routePts;
  if (pts.length < 2) return;
  const p = nav.progressM;
  state.closestRouteIdx = Math.min(pts.length - 1, nav.segIdx + 1);
  const next = nav.maneuvers.find((m) => nav.cum[m.idx] > p + 2) || nav.maneuvers[nav.maneuvers.length - 1];
  state.maneuverId = next.id;
  state.nextWpIdx = next.idx;
  state.streetName = (next.name || "").slice(0, 31);
  state.turnDistM = Math.max(0, Math.round(nav.cum[next.idx] - p));
  state.destDistM = Math.max(0, Math.round(nav.total - p));
  const remainingS = nav.total > 0 ? nav.durationS * (state.destDistM / nav.total) : 0;
  state.etaMinutes = state.destDistM > 30 ? Math.max(1, Math.round(remainingS / 60)) : 0;
}

// Frames are drawn unmirrored into an offscreen canvas, then copied to the visible canvas
// (mirrored in HUD mode, like the panel's MADCTL flip)
const frameCanvas = document.createElement("canvas");
const fx = frameCanvas.getContext("2d");
const fadeCache = new Map();

function setLayout(name) {

const FONT = "-apple-system, 'Helvetica Neue', Arial, sans-serif";
function txt(s, x, y, px, col, align = "center", weight = 700, base = "middle", maxW) {
  fx.font = `${weight} ${px}px ${FONT}`;
  fx.fillStyle = col;
  fx.textAlign = align;
  fx.textBaseline = base;
  if (maxW && fx.measureText(s).width > maxW) {
    while (s.length > 1 && fx.measureText(s + "..").width > maxW) s = s.slice(0, -1);
    s += "..";
  }
  fx.fillText(s, x, y);
}

function computeZoomScale(speedMph, turnDistM, dt) {
  //   0 mph -> 0.38 m/px, 8 mph -> 0.68, 20 mph -> 1.10, 45 mph -> 2.20, 80 mph -> 4.00
  let target = 0.38;
  if (speedMph <= 8.0) {
    const t = Math.max(0, speedMph) / 8.0;
    target = 0.38 + (0.68 - 0.38) * (t * (0.35 + 0.65 * t));
  } else if (speedMph <= 20.0) {
    target = 0.68 + ((speedMph - 8.0) / 12.0) * (1.10 - 0.68);
  } else if (speedMph <= 45.0) {
    target = 1.10 + ((speedMph - 20.0) / 25.0) * (2.20 - 1.10);
  } else {
    const clamped = Math.min(speedMph, 80.0);
    target = 2.20 + ((clamped - 45.0) / 35.0) * (4.00 - 2.20);
  }
  if (turnDistM < 180) {
    const w = Math.max(0, (180 - turnDistM) / 180);
    const closeTurnScale = speedMph < 10 ? 0.45 : 0.80;
    target = Math.min(target, target * (1 - w) + closeTurnScale * w);
  }
  // Frame-rate independent smoothing (~0.06 per 33 ms frame, same as the firmware)
  smoothedScale += (target - smoothedScale) * (1 - Math.exp(-dt * 1.9));
  return smoothedScale;
}

function makeProjector(rad, invScale) {
  const cosH = Math.cos(rad) * invScale;
  const sinH = Math.sin(rad) * invScale;
  const px = state.playerX, py = state.playerY;
  return (wx, wy) => {
    const dx = wx - px, dy = wy - py;
    return { x: L.playerX + (dx * cosH - dy * sinH), y: L.playerY - (dx * sinH + dy * cosH) };
  };
}

// Off-screen blips are pulled onto the edge of the band between the overlays
function clampToPerimeter(pt) {
  const minX = L.clampX0, maxX = L.clampX1, minY = L.blipMargin, maxY = L.h - L.blipMargin;
  if (pt.x >= minX && pt.x <= maxX && pt.y >= minY && pt.y <= maxY) return { x: pt.x, y: pt.y, clamped: false };
  const vx = pt.x - L.playerX, vy = pt.y - L.playerY;
  const tx = vx > 0 ? (maxX - L.playerX) / vx : (vx < 0 ? (minX - L.playerX) / vx : 1e9);
  const ty = vy > 0 ? (maxY - L.playerY) / vy : (vy < 0 ? (minY - L.playerY) / vy : 1e9);
  const t = Math.min(tx, ty);
  return { x: L.playerX + vx * t, y: L.playerY + vy * t, clamped: true };
}

function turnArrowColor(turnDistM) {
  if (hudMode) return HUD_GREEN;
  if (turnDistM < 100) return "#00E676";
  if (turnDistM < 300) return "#FFD600";
  return "#FFFFFF";
}

// Tapered body + notched chevron head, built from the same turtle path as drawManeuverArrow()
const ARROW_PATHS = {
  2: [[0.55, 0], [0.30, 45], [0.45, 0]],   // slight (mirrored for left)
  3: [[0.55, 0], [0.24, 90], [0.42, 0]],   // left/right
  4: [[0.62, 0], [0.20, 135], [0.22, 0]],  // sharp
  5: [[0.55, 0], [-0.22, 180], [0.30, 0]], // U-turn (left)
  1: [[1.0, 0]]                            // straight
};
function drawManeuverArrow(cx, cy, size, id, col, bg, c = fx) {
  if (id === 9) { // arrive: map pin with a hole
    const r = size * 0.28, py = cy - size * 0.12;
    c.fillStyle = col;
    c.beginPath(); c.arc(cx, py, r, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.moveTo(cx - r * 0.81, py + r * 0.59); c.lineTo(cx + r * 0.81, py + r * 0.59); c.lineTo(cx, py + r * 2.1); c.fill();
    c.fillStyle = bg; c.beginPath(); c.arc(cx, py, r * 0.4, 0, Math.PI * 2); c.fill();
    return;
  }
  const mirror = id === 2 || id === 3 || id === 4;
  const key = { 2: 2, 6: 2, 3: 3, 7: 3, 4: 4, 8: 4, 5: 5 }[id] || 1;
  let x = 0, y = 0, h = -Math.PI / 2;
  const pts = [[0, 0]];
  for (const [a, deg] of ARROW_PATHS[key]) {
    if (!deg) { x += Math.cos(h) * a; y += Math.sin(h) * a; pts.push([x, y]); continue; }
    const r = Math.abs(a), dir = a < 0 ? -1 : 1, steps = Math.max(6, Math.round(deg / 10));
    const dh = ((deg * Math.PI) / 180 / steps) * dir, step = 2 * r * Math.sin(Math.abs(dh) / 2);
    for (let i = 0; i < steps; i++) { const hm = h + dh / 2; x += Math.cos(hm) * step; y += Math.sin(hm) * step; h += dh; pts.push([x, y]); }
  }
  if (mirror) { pts.forEach((p) => (p[0] = -p[0])); h = Math.PI - h; }
  const HL = 0.441, HW = 0.414, NOTCH = 0.35, ch = Math.cos(h), sh = Math.sin(h);
  const [tx, ty] = pts[pts.length - 1];
  const all = pts.concat([[tx + ch * HL, ty + sh * HL], [tx - sh * HW, ty + ch * HW], [tx + sh * HW, ty - ch * HW]]);
  const xs = all.map((p) => p[0]), ys = all.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sc = size / Math.max(x1 - x0, y1 - y0, 1e-3);
  const ox = cx - ((x0 + x1) / 2) * sc, oy = cy - ((y0 + y1) / 2) * sc;
  const S = ([px, py]) => [ox + px * sc, oy + py * sc];
  c.strokeStyle = col; c.fillStyle = col; c.lineCap = "round";
  for (let i = 0; i < pts.length - 1; i++) {
    const t = (i + 0.5) / (pts.length - 1);
    c.lineWidth = Math.max(2, (0.07 + 0.15 * t) * sc);
    const [ax, ay] = S(pts[i]), [bx, by] = S(pts[i + 1]);
    c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
  }
  const tip = S([tx + ch * HL, ty + sh * HL]), lw = S([tx - sh * HW, ty + ch * HW]);
  const rw = S([tx + sh * HW, ty - ch * HW]), nt = S([tx + ch * HL * NOTCH, ty + sh * HL * NOTCH]);
  c.beginPath(); c.moveTo(...tip); c.lineTo(...lw); c.lineTo(...nt); c.lineTo(...rw); c.closePath(); c.fill();
}

function drawLinkDot(x, y, r) {
  if (theme().light) { fx.fillStyle = "#000"; fx.beginPath(); fx.arc(x, y, r + 1, 0, Math.PI * 2); fx.fill(); }
  fx.fillStyle = ble.connected ? LINK_OK : LINK_DOWN;
  fx.beginPath(); fx.arc(x, y, r, 0, Math.PI * 2); fx.fill();
}

function formatTurnDist(m, roundFt) {
  const mi = m / 1609.34;
  return mi >= 0.1 ? `${mi.toFixed(1)} mi` : `${Math.round((m * 3.28084) / roundFt) * roundFt} ft`;
}

// "8" + "min", "1:05" + "hr" (formatEtaParts)
function etaParts() {
  if (state.destDistM < 30) return ["0", "min"];
  const m = state.etaMinutes;
  if (m >= 60) return [`${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`, "hr"];
  return [`${Math.max(1, m)}`, "min"];
}

// Soft backdrop behind floating text (applyOverlayFade): opacity 92% -> 75% -> 0% from the
// screen edge inward, tapering over 18 px on the open vertical edge. Cached per layout/theme.
function overlayFade(fw, fh, fromLeft, taperBottom) {
  const key = `${L.w}:${hudMode}:${fw}:${fh}:${fromLeft}`;
  if (fadeCache.has(key)) return fadeCache.get(key);
  const c = document.createElement("canvas"); c.width = fw; c.height = fh;
  const g = c.getContext("2d"), rgb = theme().rgbBg;
  const hg = g.createLinearGradient(fromLeft ? 0 : fw, 0, fromLeft ? fw : 0, 0);
  hg.addColorStop(0, `rgba(${rgb},0.92)`); hg.addColorStop(0.55, `rgba(${rgb},0.75)`); hg.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = hg; g.fillRect(0, 0, fw, fh);
  g.globalCompositeOperation = "destination-in";
  const vg = g.createLinearGradient(0, taperBottom ? fh : 0, 0, taperBottom ? fh - 18 : 18);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,1)");
  g.fillStyle = vg; g.fillRect(0, 0, fw, fh);
  fadeCache.set(key, c);
  return c;
}

// Heavy blur + tint disc behind the speedometer, feathered over the outer 4 px (applyBlurDisc)
const blurCanvas = document.createElement("canvas");
function blurDisc(cx, cy, R) {
  const d = 2 * R + 2, th = theme();
  blurCanvas.width = blurCanvas.height = d;
  const g = blurCanvas.getContext("2d");
  g.filter = `blur(${L.blurPx}px)`;
  g.drawImage(frameCanvas, cx - R - 1, cy - R - 1, d, d, 0, 0, d, d);
  g.filter = "none";
  g.fillStyle = `rgba(${th.rgbBg},${th.blurTint})`; g.fillRect(0, 0, d, d);
  g.globalCompositeOperation = "destination-in";
  const rg = g.createRadialGradient(R + 1, R + 1, R - 4, R + 1, R + 1, R);
  rg.addColorStop(0, "rgba(0,0,0,1)"); rg.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = rg; g.fillRect(0, 0, d, d);
  fx.drawImage(blurCanvas, cx - R - 1, cy - R - 1);
}

function edgeVignette() {
  const v = L.vignette, rgb = theme().rgbBg;
  const side = (x0, y0, x1, y1, rx, ry, rw, rh) => {
    const g = fx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, `rgba(${rgb},1)`); g.addColorStop(1, `rgba(${rgb},0)`);
    fx.fillStyle = g; fx.fillRect(rx, ry, rw, rh);
  };
  side(0, 0, v, 0, 0, 0, v, L.h);
  side(L.w, 0, L.w - v, 0, L.w - v, 0, v, L.h);
  side(0, 0, 0, v, 0, 0, L.w, v);
  side(0, L.h, 0, L.h - v, 0, L.h - v, L.w, v);
}

// Mini speedometer: 270-degree arc (0..80 mph), red tick at the current road's limit
function miniSpeedo(cx, cy, r) {
  const th = theme(), a0 = Math.PI * 0.75, sweep = Math.PI * 1.5, max = 80;
  const mph = Math.round(state.speedMph), limit = state.speedLimitMph;
  fx.lineWidth = L.speedoHalfW * 2 + 1;
  fx.lineCap = "butt"; fx.strokeStyle = th.barTrack;
  fx.beginPath(); fx.arc(cx, cy, r, a0, a0 + sweep); fx.stroke();
  const frac = Math.min(1, mph / max);
  if (frac > 0.005) {
    fx.lineCap = "round";
    fx.strokeStyle = limit > 0 && mph > limit + 5 ? LINK_DOWN : th.speedoFill;
    fx.beginPath(); fx.arc(cx, cy, r, a0, a0 + sweep * frac); fx.stroke();
  }
  if (limit > 0) {
    const la = a0 + sweep * Math.min(1, limit / max), inner = r - L.speedoHalfW - 4, outer = r + L.speedoHalfW + 4;
    fx.strokeStyle = LINK_DOWN; fx.lineWidth = L.w > 400 ? 4 : 3; fx.lineCap = "round";
    fx.beginPath(); fx.moveTo(cx + Math.cos(la) * inner, cy + Math.sin(la) * inner);
    fx.lineTo(cx + Math.cos(la) * outer, cy + Math.sin(la) * outer); fx.stroke();
  }
  txt(`${mph}`, cx, cy, L.speedoNumPx, th.textMain, "center", 800);
  txt("mph", cx, cy + r - (L.w > 400 ? 4 : 3), L.speedoMphPx, th.textMuted, "center", 600);
}

function renderModeA(dt) {
  const th = theme();
  const baseScale = currentBaseScale;
  const scale = baseScale * L.zoomMult;
  const rad = (state.headingDeg * Math.PI) / 180.0;
  const widthBoost = Math.min(2.15, Math.max(0.85, Math.pow(1.1 / baseScale, 0.55))) * L.roadWidthMult;
  const project = makeProjector(rad, 1.0 / scale);
  document.getElementById("lblSpeed").textContent =
    `${state.speedMph.toFixed(1)} mph · ${scale.toFixed(2)} m/px (${Math.round((L.playerY) * scale)}m ahead)`;

  fx.fillStyle = th.mapBg; fx.fillRect(0, 0, L.w, L.h);
  fx.lineCap = "round"; fx.lineJoin = "round";
  const stroke = (pts) => {
    fx.beginPath();
    pts.forEach((pt, i) => { const s = project(pt.x, pt.y); if (i) fx.lineTo(s.x, s.y); else fx.moveTo(s.x, s.y); });
    fx.stroke();
  };
  if (th.casings) {
    for (const way of state.ways) {
      if (way.tier < 2 || way.pts.length < 2) continue;
      fx.strokeStyle = way.tier === 3 ? th.hwyCasing : th.artCasing;
      fx.lineWidth = (way.tier === 3 ? 10 : 8) * widthBoost;
      stroke(way.pts);
    }
  }
  for (const way of state.ways) {
    if (way.pts.length < 2) continue;
    fx.strokeStyle = way.tier === 3 ? th.hwyCore : (way.tier === 2 ? th.artCore : th.roadLocal);
    fx.lineWidth = (way.tier === 3 ? 7 : (way.tier === 2 ? 5 : 3)) * widthBoost;
    stroke(way.pts);
  }
  if (state.routePts.length >= 2) {
    const route = [{ x: state.playerX, y: state.playerY }, ...state.routePts.slice(state.closestRouteIdx)];
    fx.strokeStyle = th.routeCasing; fx.lineWidth = 9 * widthBoost; stroke(route);
    fx.strokeStyle = th.routeCore; fx.lineWidth = 5 * widthBoost; stroke(route);
  }

  // Blips (no text on the map)
  if (state.routePts.length >= 2) {
    const last = state.routePts.length - 1;
    if (state.nextWpIdx < last) {
      const p = state.routePts[state.nextWpIdx], s = clampToPerimeter(project(p.x, p.y));
      fx.fillStyle = th.blipOutline; fx.fillRect(s.x - 8, s.y - 8, 17, 17);
      fx.fillStyle = th.blipRed; fx.fillRect(s.x - 6, s.y - 6, 13, 13);
      fx.fillStyle = th.blipYellow; fx.fillRect(s.x - 3, s.y - 3, 7, 7);
    }
    const p = state.routePts[last], s = clampToPerimeter(project(p.x, p.y));
    for (const [r, c] of [[10, th.blipOutline], [8, th.destRing], [6, th.destGap], [4, th.destCore]]) {
      fx.fillStyle = c; fx.beginPath(); fx.arc(s.x, s.y, r, 0, Math.PI * 2); fx.fill();
    }
  }
  const n = clampToPerimeter({ x: L.playerX - Math.sin(rad) * 1000, y: L.playerY - Math.cos(rad) * 1000 });
  fx.fillStyle = th.northBg; fx.beginPath(); fx.arc(n.x, n.y, 10, 0, Math.PI * 2); fx.fill();
  fx.strokeStyle = th.northFg; fx.lineWidth = 1.5; fx.beginPath(); fx.arc(n.x, n.y, 9, 0, Math.PI * 2); fx.stroke();
  txt("N", n.x, n.y + 0.5, 11, th.northFg, "center", 800);

  const px = L.playerX, py = L.playerY;
  fx.fillStyle = th.playerOutline;
  fx.beginPath(); fx.moveTo(px, py - 13); fx.lineTo(px - 11, py + 11); fx.lineTo(px + 11, py + 11); fx.fill();
  fx.fillStyle = th.playerFill;
  fx.beginPath(); fx.moveTo(px, py - 9); fx.lineTo(px - 7, py + 7); fx.lineTo(px, py + 3); fx.lineTo(px + 7, py + 7); fx.fill();

  // Backdrops for the floating overlays
  edgeVignette();
  fx.drawImage(overlayFade(L.leftFadeW, L.leftFadeH, true, true), 0, 0);
  fx.drawImage(overlayFade(L.w - L.rightFadeX, L.h - L.rightFadeY, false, false), L.rightFadeX, L.rightFadeY);
  blurDisc(L.speedoX, L.speedoY, L.blurR);

  // Top-left: turn arrow, distance, street
  drawManeuverArrow(L.infoX, L.arrowY, L.arrowSize, state.maneuverId, hudMode ? HUD_GREEN : (th.light ? "#000" : "#FFF"), th.colBg);
  txt(formatTurnDist(state.turnDistM, 50), L.infoX, L.distY, L.distPx, th.textMain, "center", 800, "middle", L.infoMaxW);
  txt(state.streetName, L.infoX, L.streetY, L.streetPx, th.textMuted, "center", 700, "middle", L.infoMaxW);

  miniSpeedo(L.speedoX, L.speedoY, L.speedoR);

  // Right: time remaining + destination distance
  const [num, unit] = etaParts();
  txt(num, L.etaX, L.etaNumY, L.etaNumPx, th.textEta, "center", 800);
  txt(unit, L.etaX, L.etaUnitY, L.etaSmallPx, th.textEta, "center", 800);
  txt(`${(state.destDistM / 1609.34).toFixed(1)} mi`, L.etaX, L.etaDistY, L.etaSmallPx, th.textEta, "center", 800);

  drawLinkDot(L.dotX, L.dotY, L.dotR);
}

function renderModeB() {
  const th = theme(), T = L.turn, accent = turnArrowColor(state.turnDistM);
  fx.fillStyle = th.colBg; fx.fillRect(0, 0, L.w, L.h);
  drawManeuverArrow(T.arrowX, T.arrowY, T.arrowSize, state.maneuverId, accent, th.colBg);

  if (state.maneuverId === 9 && state.turnDistM < 30) {
    txt("Arrived", T.numX, T.numY + 10, T.unitPx * 1.2, th.textMain, "center", 800);
  } else {
    const mi = state.turnDistM / 1609.34;
    const [num, unit] = mi >= 0.1
      ? [mi >= 10 ? mi.toFixed(0) : mi.toFixed(1), "mi"]
      : [`${Math.round((state.turnDistM * 3.28084) / 25) * 25}`, "ft"];
    txt(num, T.numX, T.numY, T.numPx, th.textMain, "center", 800);
    txt(unit, T.numX, T.unitY, T.unitPx, th.textMain, "center", 700);
  }
  txt(state.streetName, T.numX, T.streetY, T.streetPx, th.light ? th.textMain : "#FFD600", "center", 800, "middle", T.streetMaxW);

  const prog = 1.0 - Math.min(1.0, state.turnDistM / 500.0);
  fx.fillStyle = th.barTrack;
  fx.beginPath(); fx.roundRect(T.barX, T.barY, T.barW, T.barH, T.barH / 2); fx.fill();
  if (T.barW * prog >= T.barH) {
    fx.fillStyle = accent;
    fx.beginPath(); fx.roundRect(T.barX, T.barY, T.barW * prog, T.barH, T.barH / 2); fx.fill();
  }

  // Bottom-right: "8 min . 3.1 mi"
  const [num, unit] = etaParts();
  const dest = `${(state.destDistM / 1609.34).toFixed(1)} mi`;
  txt(dest, T.etaX, T.etaY, T.etaPx, th.textEta, "right", 800, "bottom");
  const sepX = T.etaX - fx.measureText(dest).width - 4 * T.sepR;
  fx.fillStyle = th.textEta; fx.beginPath(); fx.arc(sepX, T.etaY - T.etaPx * 0.4, T.sepR, 0, Math.PI * 2); fx.fill();
  txt(`${num} ${unit}`, sepX - 4 * T.sepR, T.etaY, T.etaPx, th.textEta, "right", 800, "bottom");

  drawLinkDot(L.dotX, L.dotY, L.dotR);
}

// ============================================================================
// Drive simulation (distance-based, frame-rate independent)
// ============================================================================
function updateSimulation(dt) {
  if (gpsWatchId !== null || state.routePts.length < 2) {
    updateNavDerivedState();
    return;
  }
  if (autoDrive) {
    nav.progressM += (Math.max(3, state.speedMph) / 2.23694) * dt;
    if (nav.progressM >= nav.total) nav.progressM = 0;
  } else {
    nav.progressM = (Number(document.getElementById("rngProgress").value) / 100.0) * nav.total;
  }
  const pos = positionAtProgress(nav.progressM);
  nav.segIdx = pos.seg;
  state.playerX = pos.x;
  state.playerY = pos.y;
  if (autoDrive) {
    let diff = pos.headingDeg - state.headingDeg;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    state.headingDeg = (state.headingDeg + diff * (1 - Math.exp(-dt * 2.5)) + 360) % 360;
    const pct = nav.total ? Math.round((nav.progressM / nav.total) * 100) : 0;
    document.getElementById("rngProgress").value = pct;
    document.getElementById("lblProgress").textContent = `${pct}%`;
    document.getElementById("rngHeading").value = Math.round(state.headingDeg);
    document.getElementById("lblHeading").textContent = `${Math.round(state.headingDeg)}°`;
  }
  updateNavDerivedState();
}

let lastFrameTs = performance.now();
function renderLoop(ts) {
  const dt = Math.min(0.1, Math.max(0, (ts - lastFrameTs) / 1000));
  lastFrameTs = ts;
  currentBaseScale = computeZoomScale(state.speedMph, state.turnDistM, dt);
  updateSimulation(dt);
  renderRadar();
  renderStatusUi();
  if (document.getElementById("devPanel").open) {
    fx.save();
    if (displayMode === 0) renderModeA(dt);
    else renderModeB();
    fx.restore();
    ctx.save();
    if (hudMode) { // HUD mode is mirrored for windshield reflection, like the panel's MADCTL flip
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(frameCanvas, 0, 0);
    ctx.restore();
  }
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);
